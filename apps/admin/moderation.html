<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صالوناتي | تطبيق الإدارة</title><style>:root{--bg:#f3ebfa;--outside:#e6d5fa;--card:#fff;--line:#d9baff;--pink:#4b0c9b;--text:#250743;--muted:#70518e}*{box-sizing:border-box}body{margin:0;background:var(--outside);color:var(--text);font:14px Tahoma,Arial,sans-serif;line-height:1.8}main{max-width:620px;min-height:100vh;margin:auto;padding:22px 16px;background:var(--bg)}h1{font-size:24px;color:var(--pink)}h2{font-size:18px}article,form,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin:15px 0}label{display:block;margin:10px 0 5px}input,textarea,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px}input,textarea{width:100%;color:var(--text);background:var(--card)}button{cursor:pointer;background:var(--pink);color:white;margin:6px 0 6px 7px}button.secondary{background:var(--card);color:var(--pink)}img,video{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}#message{white-space:pre-wrap}button:disabled{opacity:.5}#adminNav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 0}#adminNav[hidden]{display:none}#adminNav button{margin:0;padding:10px 4px;background:var(--card);color:var(--pink);font-size:12px}#adminNav button[aria-current="page"]{background:var(--pink);color:white}body[data-admin-section="ads"] #queue article:not([data-kind="advertisement"]),body:not([data-admin-section="ads"]) #queue article[data-kind="advertisement"]{display:none}body:not([data-admin-section="home"]):not([data-admin-section="ads"]) #queue,body:not([data-admin-section="finance"]) #adminFinance{display:none}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats button{background:var(--card);color:var(--text);margin:0}.stats strong{display:block;font-size:25px;color:var(--pink)}[hidden]{display:none!important}select{max-width:100%}article{overflow-wrap:anywhere}</style></head><body><main><h1>إدارة صالوناتي</h1><nav id="adminNav" aria-label="أقسام الإدارة" hidden></nav><h2 id="sectionTitle">الرئيسية</h2><section id="adminSection"></section><div id="account"></div><p id="message" role="status" aria-live="polite"></p><div id="queue"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const categories={hair:'قص وخدمات الشعر',makeup:'مكياج',skin:'العناية بالبشرة',nails:'أظافر'};let user=null;let setupToken=new URLSearchParams(location.hash.slice(1)).get('setup')||'';if(setupToken)history.replaceState(null,'',location.pathname);let adminBusy=false;
const errorText={login_required:'يلزم تسجيل الدخول.',admin_required:'هذا الحساب ليس حساب إدارة.',invalid_credentials:'البريد أو كلمة المرور غير صحيحة.',invalid_credentials_format:'أدخلي بريدًا صحيحًا وكلمة مرور لا تقل عن 10 أحرف.',setup_unavailable:'رابط التهيئة غير صالح أو انتهت صلاحيته.',account_unavailable:'تم إعداد حساب الإدارة مسبقًا أو البريد مستخدم.',review_stale:'هذا الإصدار تغير أو تمت مراجعته. حدّثي القائمة.',agreement_required:'يجب تحديد اتفاق الإدارة وموافقة الصالون عليه قبل نشر الإعلان في الأقسام العامة.',reason_required:'اكتبي سبب الرفض.',too_many_attempts:'محاولات كثيرة. حاولي لاحقًا.'};
async function api(path,body){const r=await fetch('/api/catalog/'+path,{method:body===undefined?'GET':'POST',credentials:'same-origin',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(errorText[d.error]||'تعذر تنفيذ العملية');return d}
function accountView(){document.getElementById('account').innerHTML=user?'<div class="row panel"><span>'+esc(user.email)+'</span><div><button onclick="loadReviews()">تحديث الطلبات</button><button class="secondary" onclick="logout()">خروج</button></div></div>':'<form onsubmit="event.preventDefault();login()"><h2>'+(setupToken?'إنشاء حساب الإدارة لأول مرة':'دخول الإدارة')+'</h2><label for="email">البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username"><label for="password">كلمة المرور</label><input id="password" type="password" required minlength="10" maxlength="128" autocomplete="'+(setupToken?'new-password':'current-password')+'"><button type="submit">'+(setupToken?'إنشاء حساب الإدارة':'دخول')+'</button></form>'}
async function login(){if(adminBusy)return;adminBusy=true;try{const d=await api(setupToken?'setup':'login',{email:document.getElementById('email').value,password:document.getElementById('password').value,setupToken});if(d.account.role!=='admin'){await api('logout',{});throw Error('هذا الحساب ليس حساب إدارة.')}setupToken='';user=d.account;accountView();await loadReviews()}catch(e){document.getElementById('message').textContent=e.message}finally{adminBusy=false}}
async function logout(){await api('logout',{});user=null;document.getElementById('queue').replaceChildren();accountView()}
function advertisementReview(a){const names={salon:'صفحة الصالون',home:'الرئيسية',hair:'الشعر',makeup:'المكياج',skin:'البشرة',nails:'الأظافر',products:'المنتجات',discounts:'الخصومات'};return '<article data-kind="advertisement" data-revision="'+esc(a.revisionId)+'"><p>صورة أو إعلان — '+esc(a.salonName)+'</p><h2>'+esc(a.title)+'</h2>'+(a.mediaType.startsWith('video/')?'<video controls muted playsinline src="'+esc(a.mediaUrl)+'"></video>':'<img src="'+esc(a.mediaUrl)+'" alt="وسائط الإعلان">')+'<p>القسم المطلوب: '+esc(names[a.placement])+'</p><p>قيمة الإعلان المتفق عليها: '+a.budget+' د.ع</p><p>ظاهر داخل صفحة الصالون تلقائيًا؛ الموافقة تخص الظهور العام.</p><label>سبب الرفض</label><textarea maxlength="500"></textarea><button data-action="approve">موافقة على الظهور العام</button><button class="secondary" data-action="reject">رفض الظهور العام</button></article>'}
function productReview(p){return '<article data-kind="product" data-revision="'+esc(p.revisionId)+'"><span class="muted">منتج — '+esc(p.salonName)+' — '+esc(p.area)+'</span><h2>'+esc(p.name)+'</h2><img src="'+esc(p.mediaUrl)+'" alt="صورة المنتج"><p>'+esc(p.description)+'</p>'+(p.previousPrice!==null?'<p>السعر المعتمد السابق: <del>'+p.previousPrice.toLocaleString('en-US')+' د.ع</del></p>':'')+'<p>السعر المطلوب: '+p.price.toLocaleString('en-US')+' د.ع</p><p>الكمية: '+p.stock+'</p><p>'+(p.active?'نشر المنتج بعد الموافقة':'طلب إخفاء المنتج')+'</p><p class="muted">'+(p.publishedRevisionId?'تعديل — يبقى المنتج السابق منشورًا حتى الاعتماد':'منتج جديد — غير منشور')+'</p><label>سبب الرفض</label><textarea maxlength="500"></textarea><button data-action="approve">موافقة ونشر</button><button class="secondary" data-action="reject">رفض</button></article>'}
async function loadReviews(){try{const [d,productData,adData]=await Promise.all([api('reviews'),api('product-reviews'),api('ad-reviews')]);d.reviews=[...d.reviews,...productData.reviews.map(p=>({...p,kind:'product'})),...adData.reviews.map(a=>({...a,kind:'advertisement'}))];document.getElementById('message').textContent='عدد الطلبات: '+d.reviews.length;document.getElementById('queue').innerHTML=d.reviews.map(s=>s.kind==='advertisement'?advertisementReview(s):s.kind==='product'?productReview(s):'<article data-revision="'+esc(s.revisionId)+'"><p class="muted">'+esc(s.salonName)+' — '+esc(s.area)+'</p><h2>'+esc(s.name)+'</h2><p>القسم: '+esc(categories[s.category])+'</p>'+(s.mediaUrl?(s.mediaType.startsWith('video/')?'<video controls muted playsinline preload="metadata" src="'+esc(s.mediaUrl)+'"></video>':'<img src="'+esc(s.mediaUrl)+'" alt="وسائط الخدمة">'):'')+'<p>السعر الأصلي: '+s.price.toLocaleString('en-US')+' د.ع · المدة: '+s.minutes+' دقيقة</p>'+(s.discount?'<p>السعر الجديد: '+s.discount.price.toLocaleString('en-US')+' د.ع</p><p>بداية الخصم: '+esc(new Date(s.discount.startsAt).toLocaleString('ar-IQ'))+'<br>نهاية الخصم: '+esc(new Date(s.discount.endsAt).toLocaleString('ar-IQ'))+'</p>':'')+'<p>'+(s.active?'نشر الخدمة بعد الموافقة':'طلب إخفاء الخدمة')+'</p><p class="muted">'+(s.publishedRevisionId?'تعديل — تبقى النسخة السابقة منشورة حتى الاعتماد':'خدمة جديدة — غير منشورة')+'</p><label>سبب الرفض</label><textarea maxlength="500"></textarea><button data-action="approve">موافقة ونشر</button><button class="secondary" data-action="reject">رفض</button></article>').join('')||'<div class="panel">لا توجد طلبات بانتظار المراجعة.</div>'}catch(e){document.getElementById('message').textContent=e.message}}
document.getElementById('queue').addEventListener('click',async e=>{const button=e.target.closest('button[data-action]');if(!button||adminBusy)return;const article=button.closest('article');const reason=article.querySelector('textarea').value;if(button.dataset.action==='reject'&&!reason.trim()){document.getElementById('message').textContent='اكتبي سبب الرفض.';return}adminBusy=true;article.querySelectorAll('button').forEach(b=>b.disabled=true);try{await api((article.dataset.kind==='advertisement'?'ad-reviews/':article.dataset.kind==='product'?'product-reviews/':'reviews/')+article.dataset.revision,{action:button.dataset.action,reason});await loadReviews()}catch(error){document.getElementById('message').textContent=error.message;article.querySelectorAll('button').forEach(b=>b.disabled=false)}finally{adminBusy=false}});
accountView();void(async()=>{try{const d=await api('me');if(d.account.role==='admin'){user=d.account;accountView();await loadReviews()}}catch{}})();
setInterval(()=>{if(user&&!document.hidden&&!adminBusy&&!document.getElementById('queue').contains(document.activeElement))void loadReviews()},30000);
</script><script src="/admin-finance.js"></script><script>
(()=>{const sections={home:'الرئيسية',registrations:'التسجيلات الجديدة',salons:'الصالونات',finance:'الإشعارات المالية',ads:'الإعلانات',settings:'الإعدادات'};let active='home',owners=[];const panel=document.getElementById('adminSection'),nav=document.getElementById('adminNav');
nav.innerHTML=Object.entries(sections).map(([id,name])=>'<button type="button" data-section="'+id+'">'+name+'</button>').join('');nav.onclick=e=>{const b=e.target.closest('[data-section]');if(b)show(b.dataset.section)};
const date=v=>v?new Date(v).toLocaleString('ar-IQ',{timeZone:'Asia/Baghdad'}):'غير مسجل';
function render(){nav.hidden=!user;document.getElementById('sectionTitle').hidden=!user;document.body.dataset.adminSection=user?active:'login';nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.section===active?'page':'false'));document.getElementById('sectionTitle').textContent=sections[active];if(!user){panel.replaceChildren();return}
const cards=[...document.querySelectorAll('#queue article')],ads=cards.filter(a=>a.dataset.kind==='advertisement').length;
if(active==='home')panel.innerHTML='<div class="stats"><button data-section="salons"><strong>'+owners.length+'</strong>الصالونات</button><button data-section="ads"><strong>'+ads+'</strong>إعلانات بانتظار الموافقة</button></div><h2>طلبات الخدمات والمنتجات</h2>';
else if(active==='salons'||active==='registrations'){const list=[...owners].sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));panel.innerHTML=(active==='registrations'?'<p class="muted">حسابات الصالونات حسب تاريخ التسجيل، الأحدث أولًا.</p>':'')+list.map(o=>'<article><h2>'+esc(o.salonName)+'</h2><p>'+esc(o.area||'')+'</p><p>'+esc(o.email)+'</p><p>تاريخ التسجيل: '+esc(date(o.createdAt))+'</p><button data-owner="'+esc(o.id)+'">الحسابات والاتفاقات</button></article>').join('')||( '<div class="panel">لا توجد صالونات مسجلة.</div>');}
else if(active==='settings')panel.innerHTML='<div class="panel"><h2>لون التطبيق</h2><button data-theme="lavender">البنفسجي</button><button data-theme="rose">الوردي</button><p>الحساب: '+esc(user.email)+'</p><button onclick="logout()">تسجيل الخروج</button></div>';
else if(active==='ads')panel.innerHTML='<p class="muted">طلبات ظهور إعلانات الصالونات في الأقسام العامة.</p>';
else panel.innerHTML='';}
function show(id){if(!sections[id])return;active=id;render()}window.adminShowSection=show;
panel.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.section)show(b.dataset.section);if(b.dataset.owner){show('finance');window.selectFinanceOwner(b.dataset.owner)}if(b.dataset.theme){localStorage.setItem('salonati_admin_theme',b.dataset.theme);theme(b.dataset.theme)}};
function theme(v){const rose=v==='rose';Object.entries({'--bg':rose?'#fbf6f7':'#f3ebfa','--outside':rose?'#f5e8eb':'#e6d5fa','--line':rose?'#ebd8de':'#d9baff','--pink':rose?'#c44d70':'#4b0c9b','--text':rose?'#3d2b30':'#250743','--muted':rose?'#947880':'#70518e'}).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))}theme(localStorage.getItem('salonati_admin_theme'));
const prior=accountView;let epoch=0;accountView=function(){prior();const current=++epoch;owners=[];render();if(user)api('finance/options').then(d=>{if(current!==epoch)return;owners=d.owners;render()}).catch(e=>document.getElementById('message').textContent=e.message)};
new MutationObserver(()=>{if(active==='home')render()}).observe(document.getElementById('queue'),{childList:true});accountView();
})();
</script></body></html>
