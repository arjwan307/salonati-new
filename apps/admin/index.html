<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صالوناتي | تطبيق الإدارة</title><style>:root{--bg:#f3ebfa;--outside:#e6d5fa;--card:#fff;--line:#d9baff;--pink:#4b0c9b;--text:#250743;--muted:#70518e}*{box-sizing:border-box}body{margin:0;background:var(--outside);color:var(--text);font:14px Tahoma,Arial,sans-serif;line-height:1.8}main{max-width:620px;min-height:100vh;margin:auto;padding:22px 16px;background:var(--bg)}h1{font-size:24px;color:var(--pink)}h2{font-size:18px}article,form,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin:15px 0}label{display:block;margin:10px 0 5px}input,textarea,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px}input,textarea{width:100%;color:var(--text);background:var(--card)}button{cursor:pointer;background:var(--pink);color:white;margin:6px 0 6px 7px}button.secondary{background:var(--card);color:var(--pink)}img,video{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}#message{white-space:pre-wrap}button:disabled{opacity:.5}#adminNav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 0}#adminNav[hidden]{display:none}#adminNav button{margin:0;padding:10px 4px;background:var(--card);color:var(--pink);font-size:12px}#adminNav button[aria-current="page"]{background:var(--pink);color:white}body:not([data-admin-section="notifications"]) #queue,body:not([data-admin-section="finance"]) #adminFinance{display:none}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats button{background:var(--card);color:var(--text);margin:0}.stats strong{display:block;font-size:25px;color:var(--pink)}[hidden]{display:none!important}select{max-width:100%}article{overflow-wrap:anywhere}.booking-salons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.booking-salons button{margin:0}.booking-icons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.booking-icons button{margin:0;padding:9px 3px}.booking-icons small{display:block;font-size:10px}.booking-icons span{font-size:28px}dialog{width:min(94vw,560px);max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--text);padding:20px}dialog::backdrop{background:#25074380}dt{font-weight:bold}dd{margin:0 0 12px;overflow-wrap:anywhere}</style></head><body><main><h1>إدارة صالوناتي</h1><nav id="adminNav" aria-label="أقسام الإدارة" hidden></nav><h2 id="sectionTitle">الرئيسية</h2><section id="adminSection"></section><div id="account"></div><p id="message" role="status" aria-live="polite"></p><div id="queue"></div></main><script src="/loyalty-ui.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const categories={hair:'قص وخدمات الشعر',makeup:'مكياج',skin:'العناية بالبشرة',nails:'أظافر'};let user=null;let setupToken=new URLSearchParams(location.hash.slice(1)).get('setup')||'';if(setupToken)history.replaceState(null,'',location.pathname);let adminBusy=false;
const errorText={payment_exceeds_balance:'المبلغ أكبر من المتبقي على الصالون أو لا توجد مستحقات قابلة للقبض.',invalid_receipt:'أدخل مبلغًا صحيحًا ورقم الوصل أو وصف الاستلام.',request_conflict:'تغيرت بيانات الاستلام. حدّث الصفحة وتحقق من المبالغ قبل المحاولة مجددًا.',login_required:'يلزم تسجيل الدخول.',admin_required:'هذا الحساب ليس حساب إدارة.',invalid_credentials:'البريد أو كلمة المرور غير صحيحة.',invalid_credentials_format:'أدخلي بريدًا صحيحًا وكلمة مرور لا تقل عن 10 أحرف.',setup_unavailable:'رابط التهيئة غير صالح أو انتهت صلاحيته.',account_unavailable:'تم إعداد حساب الإدارة مسبقًا أو البريد مستخدم.',review_stale:'هذا الإصدار تغير أو تمت مراجعته. حدّثي القائمة.',agreement_required:'يجب تحديد اتفاق الإدارة وموافقة الصالون عليه قبل نشر الإعلان في الأقسام العامة.',reason_required:'اكتبي سبب الرفض.',too_many_attempts:'محاولات كثيرة. حاولي لاحقًا.'};
async function api(path,body){const r=await fetch('/api/catalog/'+path,{method:body===undefined?'GET':'POST',credentials:'same-origin',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(errorText[d.error]||'تعذر تنفيذ العملية');return d}
function accountView(){document.getElementById('account').innerHTML=user?'<div class="row panel"><span>'+esc(user.email)+'</span><div><button onclick="loadReviews()">تحديث الطلبات</button><button class="secondary" onclick="logout()">خروج</button></div></div>':'<form onsubmit="event.preventDefault();login()"><h2>'+(setupToken?'إنشاء حساب الإدارة لأول مرة':'دخول الإدارة')+'</h2><label for="email">البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username"><label for="password">كلمة المرور</label><input id="password" type="password" required minlength="10" maxlength="128" autocomplete="'+(setupToken?'new-password':'current-password')+'"><button type="submit">'+(setupToken?'إنشاء حساب الإدارة':'دخول')+'</button></form>'}
async function login(){if(adminBusy)return;adminBusy=true;try{const d=await api(setupToken?'setup':'login',{email:document.getElementById('email').value,password:document.getElementById('password').value,setupToken});if(d.account.role!=='admin'){await api('logout',{});throw Error('هذا الحساب ليس حساب إدارة.')}setupToken='';user=d.account;accountView();await loadReviews()}catch(e){document.getElementById('message').textContent=e.message}finally{adminBusy=false}}
async function logout(){await api('logout',{});user=null;document.getElementById('queue').replaceChildren();accountView()}
function advertisementReview(a){const names={salon:'صفحة الصالون',home:'الرئيسية',hair:'الشعر',makeup:'المكياج',skin:'البشرة',nails:'الأظافر',products:'المنتجات',discounts:'الخصومات'};return '<article data-kind="advertisement" data-revision="'+esc(a.revisionId)+'"><p>صورة أو إعلان — '+esc(a.salonName)+'</p><h2>'+esc(a.title)+'</h2>'+(a.mediaType.startsWith('video/')?'<video controls muted playsinline src="'+esc(a.mediaUrl)+'"></video>':'<img src="'+esc(a.mediaUrl)+'" alt="وسائط الإعلان">')+'<p>القسم المطلوب: '+esc(names[a.placement])+'</p><p>قيمة الإعلان المتفق عليها: '+a.budget+' د.ع</p><p>ظاهر داخل صفحة الصالون تلقائيًا؛ الموافقة تخص الظهور العام.</p><label>سبب الرفض</label><textarea maxlength="500"></textarea><button data-action="approve">موافقة على الظهور العام</button><button class="secondary" data-action="reject">رفض الظهور العام</button></article>'}
function productReview(p){return '<article data-kind="product" data-revision="'+esc(p.revisionId)+'"><span class="muted">منتج — '+esc(p.salonName)+' — '+esc(p.area)+'</span><h2>'+esc(p.name)+'</h2><img src="'+esc(p.mediaUrl)+'" alt="صورة المنتج"><p>'+esc(p.description)+'</p>'+(p.previousPrice!==null?'<p>السعر المعتمد السابق: <del>'+p.previousPrice.toLocaleString('en-US')+' د.ع</del></p>':'')+'<p>السعر المطلوب: '+p.price.toLocaleString('en-US')+' د.ع</p><p>الكمية: '+p.stock+'</p><p>'+(p.active?'نشر المنتج بعد الموافقة':'طلب إخفاء المنتج')+'</p><p class="muted">'+(p.publishedRevisionId?'تعديل — يبقى المنتج السابق منشورًا حتى الاعتماد':'منتج جديد — غير منشور')+'</p><label>سبب الرفض</label><textarea maxlength="500"></textarea><button data-action="approve">موافقة ونشر</button><button class="secondary" data-action="reject">رفض</button></article>'}
async function loadReviews(){try{const [d,productData,adData,noticeData]=await Promise.all([api('reviews'),api('product-reviews'),api('ad-reviews'),api('workflow/notifications')]);d.reviews=[...d.reviews,...productData.reviews.map(p=>({...p,kind:'product'})),...adData.reviews.map(a=>({...a,kind:'advertisement'}))];document.getElementById('message').textContent='عدد الطلبات: '+d.reviews.length;document.getElementById('queue').innerHTML=d.reviews.map(s=>s.kind==='advertisement'?advertisementReview(s):s.kind==='product'?productReview(s):'<article data-revision="'+esc(s.revisionId)+'"><p class="muted">'+esc(s.salonName)+' — '+esc(s.area)+'</p><h2>'+esc(s.name)+'</h2><p>القسم: '+esc(categories[s.category])+'</p>'+(s.mediaUrl?(s.mediaType.startsWith('video/')?'<video controls muted playsinline preload="metadata" src="'+esc(s.mediaUrl)+'"></video>':'<img src="'+esc(s.mediaUrl)+'" alt="وسائط الخدمة">'):'')+'<p>السعر الأصلي: '+s.price.toLocaleString('en-US')+' د.ع · المدة: '+s.minutes+' دقيقة</p>'+(s.discount?'<p>السعر الجديد: '+s.discount.price.toLocaleString('en-US')+' د.ع</p><p>بداية الخصم: '+esc(new Date(s.discount.startsAt).toLocaleString('ar-IQ'))+'<br>نهاية الخصم: '+esc(new Date(s.discount.endsAt).toLocaleString('ar-IQ'))+'</p>':'')+'<p>'+(s.active?'نشر الخدمة بعد الموافقة':'طلب إخفاء الخدمة')+'</p><p class="muted">'+(s.publishedRevisionId?'تعديل — تبقى النسخة السابقة منشورة حتى الاعتماد':'خدمة جديدة — غير منشورة')+'</p><label>سبب الرفض</label><textarea maxlength="500"></textarea><button data-action="approve">موافقة ونشر</button><button class="secondary" data-action="reject">رفض</button></article>').join('')||'<div class="panel">لا توجد طلبات بانتظار المراجعة.</div>';document.getElementById('queue').insertAdjacentHTML('beforeend',noticeData.notifications.map(n=>'<article><h3>'+esc(n.salon_name)+'</h3><p>'+esc(n.customer_name)+' — '+esc(n.event==='review_requested'?'اكتملت الزيارة وأُرسلت للزبونة رسالة طلب التقييم':n.event==='service_started'?'تم مسح رمز الاستقبال وتسجيل مستحق الإدارة':'وصل طلب حجز جديد')+'</p><p>'+esc(new Date(n.created_at).toLocaleString('ar-IQ',{timeZone:'Asia/Baghdad'}))+'</p></article>').join(''))}catch(e){document.getElementById('message').textContent=e.message}}
document.getElementById('queue').addEventListener('click',async e=>{const button=e.target.closest('button[data-action]');if(!button||adminBusy)return;const article=button.closest('article');const reason=article.querySelector('textarea').value;if(button.dataset.action==='reject'&&!reason.trim()){document.getElementById('message').textContent='اكتبي سبب الرفض.';return}adminBusy=true;article.querySelectorAll('button').forEach(b=>b.disabled=true);try{await api((article.dataset.kind==='advertisement'?'ad-reviews/':article.dataset.kind==='product'?'product-reviews/':'reviews/')+article.dataset.revision,{action:button.dataset.action,reason});await loadReviews()}catch(error){document.getElementById('message').textContent=error.message;article.querySelectorAll('button').forEach(b=>b.disabled=false)}finally{adminBusy=false}});
accountView();void(async()=>{try{const d=await api('me');if(d.account.role==='admin'){user=d.account;accountView();await loadReviews()}}catch{}})();
setInterval(()=>{if(user&&!document.hidden&&!adminBusy&&!document.getElementById('queue').contains(document.activeElement))void loadReviews()},30000);
</script><script src="/admin-finance.js"></script><script>
(()=>{const sections={home:'الرئيسية',registrations:'التسجيلات الجديدة',salons:'الصالونات',notifications:'الإشعارات',finance:'المالية',ads:'الإعلانات',settings:'الإعدادات'};let active='home',owners=[],campaigns=[],editingCampaign=null,registrations=[],bookingSalons=[],bookingError='',chosenSalon='',salonBookings=[],moreBookings=false,bookingOffset=0,bookingLoading=false,bookingVersion=0;const panel=document.getElementById('adminSection'),nav=document.getElementById('adminNav');
nav.innerHTML=Object.entries(sections).map(([id,name])=>'<button type="button" data-section="'+id+'">'+name+'</button>').join('');nav.onclick=e=>{const b=e.target.closest('[data-section]');if(b)show(b.dataset.section)};
const date=v=>v?new Date(v).toLocaleString('ar-IQ',{timeZone:'Asia/Baghdad'}):'غير مسجل';
function render(){nav.hidden=!user;document.getElementById('sectionTitle').hidden=!user;document.body.dataset.adminSection=user?active:'login';nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.section===active?'page':'false'));document.getElementById('sectionTitle').textContent=sections[active];if(!user){panel.replaceChildren();return}
const cards=[...document.querySelectorAll('#queue article')],ads=cards.filter(a=>a.dataset.kind==='advertisement').length;
if(active==='home')panel.innerHTML='<button data-section="notifications" id="notificationBell" aria-label="فتح الإشعارات">🔔 الإشعارات ('+cards.length+')</button><div class="stats"><button data-section="salons"><strong>'+registrations.filter(r=>r.status==='approved').length+'</strong>الصالونات</button><button data-section="notifications"><strong>'+cards.length+'</strong>طلبات بانتظار الموافقة</button></div>';
else if(active==='salons'||active==='registrations'){const list=registrations.filter(r=>active==='salons'?r.status==='approved':r.status!=='approved');panel.innerHTML=list.map(r=>'<article><button class="secondary" data-registration="'+esc(r.ownerId)+'" style="width:100%"><img src="'+esc(r.facadeUrl)+'" alt="واجهة '+esc(r.salonName)+'" style="height:140px;object-fit:cover"><h2>'+esc(r.salonName)+'</h2></button><p>'+esc(r.area)+'</p><p>'+esc(({pending:'بانتظار الموافقة',rejected:'أُعيد للتعديل',approved:'معتمد'})[r.status])+' · '+esc(date(r.submittedAt))+'</p></article>').join('')||'<div class="panel">'+(active==='salons'?'لا توجد صالونات معتمدة.':'لا توجد طلبات تسجيل جديدة.')+'</div>';}
else if(active==='settings')panel.innerHTML='<div class="panel"><h2>لون التطبيق</h2><button data-theme="lavender">البنفسجي</button><button data-theme="rose">الوردي</button><p>الحساب: '+esc(user.email)+'</p><button onclick="logout()">تسجيل الخروج</button><hr><h3>بيانات العرض</h3><p>حذف الصالونات والحجوزات والطلبات والحسابات التي أُضيفت للعرض فقط.</p><button data-sample-delete="yes">حذف بيانات العرض من كل الأقسام</button></div>';
else if(active==='notifications')panel.innerHTML='<h2>موافقات الخدمات والمنتجات والإعلانات</h2>';else if(active==='ads')renderCampaigns();
else panel.innerHTML='';if(active==='home')renderBookingHome();if(active==='settings'){panel.insertAdjacentHTML('beforeend','<section id="loyaltySettings" class="panel"></section>');void renderLoyaltySettings()}}
async function renderLoyaltySettings(){try{const data=await api('admin/loyalty'),host=document.getElementById('loyaltySettings');if(!host||!user)return;host.innerHTML='<h3>خدمة الزيارة الرابعة المجانية</h3><p>ثلاث زيارات مكتملة تمنح خدمة واحدة مجانية تحددها الإدارة.</p>'+owners.map(o=>'<form data-loyalty-owner="'+esc(o.id)+'"><label>'+esc(o.salonName)+'</label><select required aria-label="الخدمة المجانية"><option value="">اختاري الخدمة</option>'+data.services.filter(s=>s.owner_id===o.id).map(s=>'<option value="'+esc(s.id)+'" '+(data.settings.some(c=>c.owner_id===o.id&&c.service_id===s.id)?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select><button>حفظ الخدمة</button></form>').join('');host.onsubmit=async e=>{e.preventDefault();const form=e.target,button=form.querySelector('button');button.disabled=true;try{await api('admin/loyalty',{ownerId:form.dataset.loyaltyOwner,serviceId:form.querySelector('select').value});document.getElementById('message').textContent='تم حفظ الخدمة المجانية لهذا الصالون.'}catch(error){document.getElementById('message').textContent=error.message}finally{button.disabled=false}}}catch(e){document.getElementById('message').textContent=e.message}}
function show(id){if(!sections[id])return;active=id;render()}window.adminShowSection=show;
panel.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.section)show(b.dataset.section);if(b.dataset.registration)openRegistration(b.dataset.registration);if(b.dataset.campaignEdit){editingCampaign=campaigns.find(c=>c.id===b.dataset.campaignEdit);renderCampaigns()}if(b.dataset.campaignDelete)deleteCampaign(b.dataset.campaignDelete);if(b.dataset.sampleDelete)deleteSamples();if(b.dataset.bookingSalon)openSalonBookings(b.dataset.bookingSalon);if(b.dataset.bookingId)openBookingDetail(b.dataset.bookingId);if(b.dataset.moreBookings)openSalonBookings(chosenSalon,true);if(b.dataset.owner){show('finance');window.selectFinanceOwner(b.dataset.owner)}if(b.dataset.theme){localStorage.setItem('salonati_admin_theme',b.dataset.theme);theme(b.dataset.theme)}};
function theme(v){const rose=v==='rose';Object.entries({'--bg':rose?'#fbf6f7':'#f3ebfa','--outside':rose?'#f5e8eb':'#e6d5fa','--line':rose?'#ebd8de':'#d9baff','--pink':rose?'#c44d70':'#4b0c9b','--text':rose?'#3d2b30':'#250743','--muted':rose?'#947880':'#70518e'}).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))}theme(localStorage.getItem('salonati_admin_theme'));
const prior=accountView;let epoch=0;accountView=function(){prior();const current=++epoch;owners=[];registrations=[];render();if(user){void refreshBookingSalons();void refreshRegistrations();void refreshCampaigns();}else{bookingVersion++;bookingSalons=[];chosenSalon='';salonBookings=[];document.getElementById('bookingDetails')?.remove();document.getElementById('registrationDetails')?.remove();}if(user)api('finance/options').then(d=>{if(current!==epoch)return;owners=d.owners;render()}).catch(e=>document.getElementById('message').textContent=e.message)};
const campaignPlaces={home:'رئيسية الزبونة',hair:'الشعر',makeup:'المكياج',skin:'البشرة',nails:'الأظافر',products:'المنتجات',discounts:'الخصومات',salon:'صفحات الصالونات'};
function renderCampaigns(){const c=editingCampaign;panel.innerHTML='<h2>إعلانات إدارة التطبيق</h2><form id="campaignForm" onsubmit="event.preventDefault();saveManagementCampaign()"><h3>'+(c?'تعديل الإعلان':'إنشاء إعلان')+'</h3><label>عنوان الإعلان</label><input id="campaignTitle" maxlength="160" required value="'+esc(c?.title||'')+'"><label>نص الإعلان</label><textarea id="campaignCopy" maxlength="1000">'+esc(c?.copy||'')+'</textarea><label>صورة أو صورة متحركة أو فيديو</label><input id="campaignFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" '+(c?'':'required')+'><p>يظهر تلقائيًا في أماكن إعلانات الإدارة بتطبيقَي الزبونة والصالون.</p><label>مكان ظهور إضافي</label><select id="campaignPlace"><option value="">أماكن إعلانات الإدارة فقط</option>'+Object.entries(campaignPlaces).map(([key,label])=>'<option value="'+key+'" '+(c?.placements.includes(key)?'selected':'')+'>'+label+'</option>').join('')+'</select><label><input id="campaignActive" type="checkbox" style="width:auto" '+(!c||c.active?'checked':'')+'> الإعلان نشط</label><button type="submit">'+(c?'حفظ التعديل':'نشر الإعلان')+'</button></form><div>'+campaigns.map(a=>'<article>'+(a.mediaType?.startsWith('video/')?'<video controls muted playsinline src="'+esc(a.mediaUrl)+'"></video>':'<img src="'+esc(a.mediaUrl)+'" alt="'+esc(a.title)+'">')+'<h3>'+esc(a.title)+'</h3><p>'+esc(a.copy)+'</p><p>'+(a.active?'نشط':'متوقف')+'</p><button data-campaign-edit="'+esc(a.id)+'">تعديل</button><button class="secondary" data-campaign-delete="'+esc(a.id)+'">حذف</button></article>').join('')+'</div>'}
async function refreshCampaigns(){try{const d=await api('admin/campaigns');if(!user)return;campaigns=d.campaigns;if(active==='ads'&&!document.getElementById('campaignForm')?.contains(document.activeElement))renderCampaigns()}catch(e){document.getElementById('message').textContent=e.message}}
window.saveManagementCampaign=async()=>{if(adminBusy)return;const title=document.getElementById('campaignTitle').value.trim(),copy=document.getElementById('campaignCopy').value,file=document.getElementById('campaignFile').files[0],place=document.getElementById('campaignPlace').value,active=document.getElementById('campaignActive').checked;if(!title||(!file&&!editingCampaign))return;adminBusy=true;try{let mediaId=editingCampaign?.mediaId;if(file){if(file.size>20*1024*1024)throw Error('حجم الملف يتجاوز 20 ميغابايت');const response=await fetch('/api/catalog/media',{method:'POST',headers:{'Content-Type':file.type},body:file,credentials:'same-origin'});const data=await response.json();if(!response.ok)throw Error('تعذر رفع ملف الإعلان');mediaId=data.id}await api('admin/campaigns',{id:editingCampaign?.id,title,copy,mediaId,placements:place?[place]:[],active});editingCampaign=null;await refreshCampaigns();renderCampaigns();document.getElementById('message').textContent='تم نشر إعلان الإدارة في الأماكن المحددة.'}catch(e){document.getElementById('message').textContent=e.message}finally{adminBusy=false}};
async function deleteCampaign(id){if(adminBusy||!confirm('حذف هذا الإعلان من أماكن ظهوره؟'))return;adminBusy=true;try{await api('admin/campaigns/delete',{id});if(editingCampaign?.id===id)editingCampaign=null;await refreshCampaigns();renderCampaigns()}catch(e){document.getElementById('message').textContent=e.message}finally{adminBusy=false}}
async function deleteSamples(){if(adminBusy||!confirm('حذف جميع بيانات العرض؟ يشمل الصالونات والحجوزات والحسابات وطلبات الموافقة المضافة للعرض.'))return;adminBusy=true;try{await api('admin/sample-data',{action:'delete'});location.reload()}catch(e){document.getElementById('message').textContent=e.message}finally{adminBusy=false}}
async function refreshRegistrations(){const version=epoch;try{const d=await api('admin/registrations');if(version!==epoch||!user)return;registrations=d.registrations;if(['home','registrations','salons'].includes(active))render()}catch(e){document.getElementById('message').textContent=e.message}}
function openRegistration(id){const r=registrations.find(x=>x.ownerId===id);if(!r)return;document.getElementById('registrationDetails')?.remove();const dialog=document.createElement('dialog');dialog.id='registrationDetails';dialog.innerHTML='<button data-close>إغلاق</button><h2>استمارة تسجيل الصالون</h2><img src="'+esc(r.facadeUrl)+'" alt="واجهة الصالون"><h3>'+esc(r.salonName)+'</h3><dl><dt>المسؤولة</dt><dd>'+esc(r.contactName)+'</dd><dt>الهاتف</dt><dd dir="ltr">'+esc(r.phone)+'</dd><dt>البريد الإلكتروني</dt><dd>'+esc(r.email)+'</dd><dt>المنطقة</dt><dd>'+esc(r.area)+'</dd><dt>العنوان التفصيلي</dt><dd>'+esc(r.address)+'</dd><dt>الموقع</dt><dd>'+esc(r.latitude)+'، '+esc(r.longitude)+'</dd><dt>تاريخ الطلب</dt><dd>'+esc(date(r.submittedAt))+'</dd></dl>'+(r.status==='pending'?'<label>سبب الإعادة للتعديل</label><textarea id="registrationReason" maxlength="500"></textarea><button data-review="approve">الموافقة وإضافة الصالون للخريطة</button><button class="secondary" data-review="reject">إعادة للتعديل</button>':'<p>'+esc(r.reason||'تم اعتماد التسجيل')+'</p>');document.body.append(dialog);dialog.querySelector('[data-close]').onclick=()=>dialog.close();dialog.addEventListener('close',()=>dialog.remove());dialog.addEventListener('click',async e=>{const button=e.target.closest('[data-review]');if(!button||adminBusy)return;const reason=dialog.querySelector('textarea').value;if(button.dataset.review==='reject'&&!reason.trim())return document.getElementById('message').textContent='اكتبي سبب إعادة الطلب للتعديل.';adminBusy=true;dialog.querySelectorAll('[data-review]').forEach(b=>b.disabled=true);try{await api('admin/registrations/review',{ownerId:r.ownerId,revision:r.revision,action:button.dataset.review,reason});dialog.close();await refreshRegistrations();document.getElementById('message').textContent=button.dataset.review==='approve'?'تم اعتماد الصالون وإضافته للخريطة.':'أُعيد الطلب إلى الصالون للتعديل.'}catch(e){document.getElementById('message').textContent=e.message;dialog.querySelectorAll('[data-review]').forEach(b=>b.disabled=false)}finally{adminBusy=false}});dialog.showModal()}
const bookingStatuses={pending:'بانتظار التأكيد',confirmed:'مؤكد',cancelled:'ملغي',completed:'مكتمل'};
function renderBookingHome(){if(!user||active!=='home')return;let host=document.getElementById('bookingHome');if(!host){host=document.createElement('section');host.id='bookingHome';panel.append(host)}host.innerHTML='<h2>حجوزات الصالونات</h2>'+(bookingError?'<p role="alert">'+esc(bookingError)+'</p>':bookingSalons.length?'<div class="booking-salons">'+bookingSalons.map(s=>'<button data-booking-salon="'+esc(s.id)+'" aria-expanded="'+(chosenSalon===s.id)+'"><strong>'+esc(s.name)+'</strong><br>'+s.bookingCount+' حجز · '+s.activeCount+' حجز نشط</button>').join('')+'</div>':'<div class="panel">لا توجد حجوزات مسجلة.</div>')+(chosenSalon?'<article><h3>'+esc(bookingSalons.find(s=>s.id===chosenSalon)?.name||'الحجوزات')+'</h3><div class="booking-icons">'+salonBookings.map((b,i)=>'<button data-booking-id="'+esc(b.id)+'" aria-label="تفاصيل الحجز '+(i+1)+'"><span aria-hidden="true">▦</span><br>حجز '+(i+1)+'<small>'+esc(date(b.startsAt))+'<br>'+esc(bookingStatuses[b.status]||b.status)+'</small></button>').join('')+'</div>'+(bookingLoading?'<p role="status">جارٍ تحميل الحجوزات…</p>':'')+(moreBookings?'<button data-more-bookings="yes" '+(bookingLoading?'disabled':'')+'>عرض المزيد من الحجوزات</button>':'')+'</article>':'')}
async function refreshBookingSalons(){const version=bookingVersion;try{const d=await api('admin/bookings');if(version!==bookingVersion||!user)return;bookingSalons=d.salons;bookingError='';renderBookingHome()}catch(e){if(version!==bookingVersion||!user)return;bookingError='تعذر تحميل الحجوزات. أعيدي المحاولة من تحديث الطلبات.';renderBookingHome()}}
async function openSalonBookings(id,append=false){if(bookingLoading)return;chosenSalon=id;if(!append){salonBookings=[];bookingOffset=0;moreBookings=false}bookingLoading=true;renderBookingHome();const version=bookingVersion;try{const d=await api('admin/bookings/salon?salonId='+encodeURIComponent(id)+'&offset='+(append?bookingOffset:0));if(version!==bookingVersion||!user)return;salonBookings=append?[...salonBookings,...d.bookings]:d.bookings;moreBookings=d.hasMore;bookingOffset=d.nextOffset;bookingError=''}catch(e){bookingError=e.message}finally{bookingLoading=false;renderBookingHome()}}
async function openBookingDetail(id){const version=bookingVersion;try{const d=await api('admin/bookings/detail?id='+encodeURIComponent(id));if(version!==bookingVersion||!user)return;document.getElementById('bookingDetails')?.remove();const b=d.booking,dialog=document.createElement('dialog');dialog.id='bookingDetails';const money=v=>v===null||v===undefined?'غير مسجل':(v/100).toLocaleString('ar-IQ')+' د.ع';dialog.innerHTML='<button id="closeBookingDetails" aria-label="إغلاق التفاصيل">إغلاق</button><h2>تفاصيل الحجز</h2><h3>'+esc(b.salonName)+'</h3><dl><dt>اسم الزبونة</dt><dd>'+esc(b.customerName||'غير مسجل')+'</dd><dt>رقم الهاتف</dt><dd>'+(b.phone?'<a dir="ltr" href="tel:'+esc(String(b.phone).replace(/[^+0-9]/g,''))+'">'+esc(b.phone)+'</a>':'غير مسجل')+'</dd><dt>الموعد</dt><dd>'+esc(date(b.startsAt))+'</dd><dt>نهاية الموعد</dt><dd>'+esc(date(b.endsAt))+'</dd><dt>حالة الحجز</dt><dd>'+esc(bookingStatuses[b.status]||b.status)+'</dd><dt>المبلغ الإجمالي</dt><dd>'+esc(money(b.totalMinor))+'</dd><dt>الدفع</dt><dd>'+esc(b.paymentMethod==='cash'?'نقدي':b.paymentMethod||'غير مسجل')+' — '+esc(({unpaid:'غير مدفوع',paid:'مدفوع'})[b.paymentStatus]||b.paymentStatus||'غير مسجل')+'</dd><dt>بدء الخدمة</dt><dd>'+esc(b.startedAt?date(b.startedAt):'لم يبدأ بعد')+'</dd><dt>الملاحظات</dt><dd>'+esc(b.notes||'لا توجد ملاحظات')+'</dd></dl><h3>الخدمات</h3>'+d.services.map(s=>'<p>'+esc(s.name)+' · '+s.minutes+' دقيقة · '+esc(money(s.priceMinor))+'</p>').join('')+'<p class="muted">رقم الحجز: '+esc(b.id)+'</p>';dialog.insertAdjacentHTML('beforeend',(window.salonatiLoyalty?.html(b.loyalty,b.reward)||'')+(b.rating?'<p>تقييم الزبونة: '+b.rating+' / 5</p>':''));document.body.append(dialog);dialog.querySelector('button').onclick=()=>dialog.close();dialog.addEventListener('close',()=>dialog.remove());dialog.showModal()}catch(e){document.getElementById('message').textContent=e.message}}
setInterval(()=>{if(user&&!document.hidden&&!document.getElementById('bookingDetails')&&!document.getElementById('registrationDetails')){void refreshBookingSalons();if(active==='registrations'||active==='salons')void refreshRegistrations()}},30000);
const previousReviews=loadReviews;loadReviews=async function(){await previousReviews();if(user){await refreshBookingSalons();await refreshRegistrations()}};
new MutationObserver(()=>{if(active==='home')render()}).observe(document.getElementById('queue'),{childList:true});accountView();
})();
</script></body></html>
