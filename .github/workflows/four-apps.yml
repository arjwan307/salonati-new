name: Four-app validation
on:
  push:
    branches: [integration/four-apps-google-studio-20261029]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, salon, admin, cosmetics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify app source has been imported
        run: test -f "google-apps/${{ matrix.app }}/package.json" && test -f "google-apps/${{ matrix.app }}/index.html"
      - name: Install dependencies
        working-directory: google-apps/${{ matrix.app }}
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        working-directory: google-apps/${{ matrix.app }}
        run: npm run lint
      - name: Build
        working-directory: google-apps/${{ matrix.app }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: salonati-${{ matrix.app }}
          path: google-apps/${{ matrix.app }}/dist/
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node deployment/build-static.mjs customer
          node deployment/build-static.mjs salon
          node deployment/build-static.mjs admin
          node deployment/build-static.mjs cosmetics
          node deployment/check-release.mjs
