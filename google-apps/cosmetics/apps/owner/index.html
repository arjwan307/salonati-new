function formatHour12(t){if(!t)return '';const [hh,mm]=String(t).split(':');let h=parseInt(hh,10);if(!Number.isFinite(h))return t;const p=h>=12?'م':'ص';h=h%12||12;return `${h}:${mm||'00'} ${p}`}
function getSalonGreetingInfo(){
 const owner=db.salon?.ownerName||'ست مريم';
 const dayNames=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
 const todayEntry=(db.hours||[]).find(x=>x.day===dayNames[new Date().getDay()])||db.hours?.[0]||{open:'08:00',close:'22:00',enabled:true};
 const openHour=parseInt(String(todayEntry.open||'08:00').split(':')[0],10);
 const nowHour=new Date().getHours();
 const isMorning=openHour>=12?false:nowHour<12;
 const hoursLabel=todayEntry.enabled===false?'اليوم مغلق':`وقت الفتح: ${formatHour12(todayEntry.open)} – ${formatHour12(todayEntry.close)}`;
 return {
  owner,
  isMorning,
  icon:isMorning?'☀️':'🌙',
  headline:isMorning?`صباح الخير والجمال، أهلاً بكِ <strong>${esc(owner)}</strong>`:`مساء الخير والتألق، أهلاً بكِ <strong>${esc(owner)}</strong>`,
  sub:`${isMorning?'رسالة الصباح':'رسالة المساء'} • ${esc(hoursLabel)}`
 };
}
function openSupportModal(){

function sendSupportMessage(){

function updateSalonPhoto(input){
 const f=input?.files?.[0];if(!f)return;
 if(f.size>2*1024*1024)return toast('اختاري صورة بحجم أقل من 2 ميغابايت');
 const r=new FileReader();
 r.onload=()=>{db.salon.image=r.result;save();toast('تم تحديث صورة الصالون')};
 r.readAsDataURL(f);
}

function booking(b){
 let ss=b.services.map(i=>db.services.find(s=>s.id==i)?.name||'خدمة محذوفة').join(' + '),
     sum=b.services.reduce((n,i)=>n+(db.services.find(s=>s.id==i)?.price||0),0),

}

 placeholder="اكتبي اسم الخدمة أو القصّة..."><div class="two"><div><label for="sprice">السعر الأصلي بالدينار</label><input id="sprice" type="number" min="0" step="1" value="${selected?.price??''}" placeholder="مثال: 25000"></div><div><label for="sminutes">المدة بالدقائق</label><input id="sminutes" type="number" min="1" step="1" value="${selected?.minutes??60}" placeholder="مثال: 60"></div></div><label for="serviceFile">صورة أو فيديو أو صورة متحركة</label><input id="serviceFile" type="file" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm" onchange="previewServiceUpload()"><div id="serviceUploadPreview">${selected?serviceMediaMarkup(selected):''}</div><label class="switch" for="serviceHasDiscount"><span>إضافة خصم</span><input id="serviceHasDiscount" type="checkbox" ${selected?.discount?'checked':''} onchange="toggleServiceDiscountForm()"></label><div id="serviceDiscountFields" ${selected?.discount?'':'hidden'}><label for="serviceDiscountPrice">السعر الجديد بعد الخصم</label><input id="serviceDiscountPrice" type="number" min="1" step="1" value="${selected?.discount?.price??''}" placeholder="السعر بعد الخصم"><label for="serviceDiscountStart">بداية الخصم</label><input id="serviceDiscountStart" type="datetime-local" value="${localDateInput(selected?.discount?.startsAt)}"><label for="serviceDiscountEnd">نهاية الخصم</label><input id="serviceDiscountEnd" type="datetime-local" value="${localDateInput(selected?.discount?.endsAt)}"></div><div class="actions"><button id="saveServiceButton" type="button" onclick="saveService()">حفظ الخدمة</button>${selected?button('إلغاء','clearEdit()'):''}</div></div></details>`}

"><option value="قص وتصفيف الشعر"></option><option value="مكياج احترافي"></option><option value="العناية بالبشرة"></option><option value="العناية بالأظافر"></option></datalist><div class="actions">${button('إضافة موظفة','addStaff()','')}</div></div></details><details class="service-editor-fold"><summary>معرض صور الصالون</summary><div class="card">${db.photos.map((src,i)=>`<div class="card"><img class="imagepreview" src="${src}" alt="صورة الصالون">${button('حذف الصورة',`deletePhoto(${i})`,'danger')}</div>`).join('')}<input type="file" id="photo" accept="image/*"><div class="actions">${button('إضافة الصورة','addPhoto()','')}</div></div></details><details class="service-editor-fold"><summary>النسخ الاحتياطي والبيانات التجريبية</summary><div class="card"><div class="actions">${button('استعادة البيانات التجريبية','resetTrialData()')}${button('تصدير نسخة احتياطية JSON','backup()')}</div><label>استعادة نسخة احتياطية</label><input type="file" id="restore" accept=".json,application/json"><div class="actions">${button('استعادة','restoreData()')}</div></div></details><div class="card" style="margin-top:14px"><button type="button" class="full danger" onclick="catalogOwnerLogout()">🔒 قفل التطبيق وتسجيل الخروج</button></div>`}
function render(){stopBookingScanner();const headerLogo=document.querySelector('header .logo');const salonImg=db.salon?.image||db.photos?.[0]||'https://images.unsplash.com/photo-1560066984-138dadb4c035?w=300';if(headerLogo){headerLogo.classList.remove('service-header-ad');headerLogo.innerHTML='<img id="headerSalonImg" src="'+esc(salonImg)+'" alt="صورة '+esc(db.salon.name)+'">'}const gInfo=getSalonGreetingInfo();const gNode=document.getElementById('salonGreeting');if(gNode)gNode.innerHTML=gInfo.icon+' '+gInfo.headline+'<small>'+gInfo.sub+'</small>';document.getElementById('salonTitle').textContent=db.salon.name;document.getElementById('main').innerHTML=({home,bookings,hours,services,products,more,notifications:()=>window.notificationsPage?.()||'',advertisements:()=>window.advertisements?.()||'',accounts:()=>window.accounts?.()||'',registration:()=>window.trialSalonRegistrationPage?.()||'',salonAuth:()=>window.salonAccountPage?.()||''})[page]();document.getElementById('nav').innerHTML=tabs.map(([k,n,ic])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span>${ic}</span>${n}</button>`).join('')}
function go(x){page=x;edit=null;render();scrollTo(0,0)}function setFilter(x){filter=x;render()}function setServiceCatFilter(x){serviceCatFilter=x;render()}function clearEdit(){edit=null;render()}
function changeBooking(i,s){let b=db.bookings.find(x=>x.id===i);if(!b)return;b.status=s;save();toast('تم تحديث حالة الحجز')}
function editService(i){edit={kind:'service',obj:db.services.find(x=>String(x.id)===String(i))};render();document.getElementById('sname')?.scrollIntoView({behavior:'smooth'})}
async function saveService(){
 const name=val('sname'),price=Number(val('sprice')),minutes=Number(val('sminutes')),file=document.getElementById('serviceFile')?.files[0],hasDiscount=document.getElementById('serviceHasDiscount').checked;
 if(!name||!val('sprice')||!Number.isSafeInteger(price)||price<0||!Number.isSafeInteger(minutes)||minutes<1)return toast('أدخلي اسم الخدمة والسعر والمدة بشكل صحيح');
 let discount=null;if(hasDiscount){const newPrice=Number(val('serviceDiscountPrice')),start=Date.parse(val('serviceDiscountStart')),end=Date.parse(val('serviceDiscountEnd'));if(!Number.isSafeInteger(newPrice)||newPrice<=0||newPrice>=price||!Number.isFinite(start)||!Number.isFinite(end)||end<=start)return toast('تحققي من السعر الجديد وبداية الخصم ونهايته');discount={price:newPrice,startsAt:new Date(start).toISOString(),endsAt:new Date(end).toISOString()}}
 if(file&&!allowedServiceFile(file))return toast('صيغة الوسائط أو حجمها غير مناسب');
 const old=edit?.kind==='service'?edit.obj:null,newService={...(old||{id:id(),active:true}),name,price,minutes,discount},button=document.getElementById('saveServiceButton');if(button)button.disabled=true;
 try{if(file){newService.mediaKey='service-'+crypto.randomUUID();await serviceMediaStore('readwrite',newService.mediaKey,file);serviceMediaCache.set(newService.mediaKey,{type:file.type,url:URL.createObjectURL(file)})}
 const next={...db,services:old?db.services.map(s=>s.id===old.id?newService:s):[...db.services,newService]};localStorage.setItem(KEY,JSON.stringify(next));db=next;const preview=document.getElementById('serviceUploadPreview');if(preview?.dataset.url)URL.revokeObjectURL(preview.dataset.url);edit=null;render();toast('تم حفظ الخدمة');
 }catch{if(button)button.disabled=false;toast('تعذر حفظ الخدمة أو الوسائط. تحققي من مساحة التخزين وحاولي مجددًا')}
}

function toggleService(i){let s=db.services.find(x=>String(x.id)===String(i));if(!s)return;s.active=!s.active;save()}
function deleteService(i){db.services=db.services.filter(x=>String(x.id)!==String(i));save();toast('تم حذف الخدمة')}
function editProduct(i){edit={kind:'product',obj:db.products.find(x=>String(x.id)===String(i))};render();document.getElementById('pname')?.scrollIntoView({behavior:'smooth'})}
function saveProduct(){let name=val('pname'),price=Number(val('pprice'));if(!name||!Number.isFinite(price)||price<0)return toast('تحققي من اسم المنتج والسعر');let o={name,price,stock:1,description:val('pdesc')};if(edit?.kind==='product')Object.assign(edit.obj,o);else db.products.push({id:id(),...o});edit=null;save();toast('تم حفظ المنتج')}
function deleteProduct(i){db.products=db.products.filter(x=>String(x.id)!==String(i));save();toast('تم حذف المنتج')}
function saveSalon(){for(let k of ['name','ownerName','area','address','phone','about','lat','lng']){const v=val(k);if(v!==undefined)db.salon[k]=v}db.salon.open=document.getElementById('open').checked;save();toast('تم حفظ بيانات الصالون')}
function saveHours(){db.hours.forEach((h,i)=>{h.enabled=document.getElementById('enabled'+i).checked;h.open=val('from'+i);h.close=val('to'+i)});save();toast('تم حفظ الدوام')}
function addStaff(){if(!val('staffName'))return toast('أدخلي الاسم');db.staff.push({id:id(),name:val('staffName'),role:val('staffRole')});save();toast('تمت إضافة الموظفة')}
function deleteStaff(i){db.staff=db.staff.filter(x=>String(x.id)!==String(i));save();toast('تم حذف الموظفة')}
function deletePhoto(i){db.photos.splice(i,1);save();toast('تم حذف الصورة')}
function addPhoto(){let f=document.getElementById('photo').files[0];if(!f)return toast('اختاري صورة');if(f.size>750000)return toast('اختاري صورة أصغر من 750 كيلوبايت');let r=new FileReader();r.onload=()=>{db.photos.push(r.result);try{save()}catch(e){db.photos.pop();toast('مساحة التخزين المحلي ممتلئة')}};r.readAsDataURL(f)}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='salonati-owner-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreData(){let f=document.getElementById('restore').files[0];if(!f)return toast('اختاري ملف JSON');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.salon||!Array.isArray(d.services)||!Array.isArray(d.bookings))throw Error();db=d;save();toast('تمت استعادة البيانات')}catch(e){toast('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(f)}
void hydrateServiceMedia();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script><script src="/owner-publishing.js"></script></body></html>
