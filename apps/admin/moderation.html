<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صالوناتي | مراجعة الخدمات</title><style>:root{--bg:#f3ebfa;--outside:#e6d5fa;--card:#fff;--line:#d9baff;--pink:#4b0c9b;--text:#250743;--muted:#70518e}*{box-sizing:border-box}body{margin:0;background:var(--outside);color:var(--text);font:14px Tahoma,Arial,sans-serif;line-height:1.8}main{max-width:620px;min-height:100vh;margin:auto;padding:22px 16px;background:var(--bg)}h1{font-size:24px;color:var(--pink)}h2{font-size:18px}article,form,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin:15px 0}label{display:block;margin:10px 0 5px}input,textarea,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px}input,textarea{width:100%;color:var(--text);background:var(--card)}button{cursor:pointer;background:var(--pink);color:white;margin:6px 0 6px 7px}button.secondary{background:var(--card);color:var(--pink)}img,video{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}#message{white-space:pre-wrap}button:disabled{opacity:.5}</style></head><body><main><h1>إدارة صالوناتي</h1><h2>مراجعة الخدمات والوسائط والخصومات</h2><div id="account"></div><p id="message" role="status" aria-live="polite"></p><div id="queue"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const categories={hair:'قص وخدمات الشعر',makeup:'مكياج',skin:'العناية بالبشرة',nails:'أظافر'};let user=null;let setupToken=new URLSearchParams(location.hash.slice(1)).get('setup')||'';if(setupToken)history.replaceState(null,'',location.pathname);let adminBusy=false;
const errorText={login_required:'يلزم تسجيل الدخول.',admin_required:'هذا الحساب ليس حساب إدارة.',invalid_credentials:'البريد أو كلمة المرور غير صحيحة.',invalid_credentials_format:'أدخلي بريدًا صحيحًا وكلمة مرور لا تقل عن 10 أحرف.',setup_unavailable:'رابط التهيئة غير صالح أو انتهت صلاحيته.',account_unavailable:'تم إعداد حساب الإدارة مسبقًا أو البريد مستخدم.',review_stale:'هذا الإصدار تغير أو تمت مراجعته. حدّثي القائمة.',reason_required:'اكتبي سبب الرفض.',too_many_attempts:'محاولات كثيرة. حاولي لاحقًا.'};
async function api(path,body){const r=await fetch('/api/catalog/'+path,{method:body===undefined?'GET':'POST',credentials:'same-origin',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(errorText[d.error]||'تعذر تنفيذ العملية');return d}
function accountView(){document.getElementById('account').innerHTML=user?'<div class="row panel"><span>'+esc(user.email)+'</span><div><button onclick="loadReviews()">تحديث الطلبات</button><button class="secondary" onclick="logout()">خروج</button></div></div>':'<form onsubmit="event.preventDefault();login()"><h2>'+(setupToken?'إنشاء حساب الإدارة لأول مرة':'دخول الإدارة')+'</h2><label for="email">البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username"><label for="password">كلمة المرور</label><input id="password" type="password" required minlength="10" maxlength="128" autocomplete="'+(setupToken?'new-password':'current-password')+'"><button type="submit">'+(setupToken?'إنشاء حساب الإدارة':'دخول')+'</button></form>'}
async function login(){if(adminBusy)return;adminBusy=true;try{const d=await api(setupToken?'setup':'login',{email:document.getElementById('email').value,password:document.getElementById('password').value,setupToken});if(d.account.role!=='admin'){await api('logout',{});throw Error('هذا الحساب ليس حساب إدارة.')}setupToken='';user=d.account;accountView();await loadReviews()}catch(e){document.getElementById('message').textContent=e.message}finally{adminBusy=false}}
async function logout(){await api('logout',{});user=null;document.getElementById('queue').replaceChildren();accountView()}
async function loadReviews(){try{const d=await api('reviews');document.getElementById('message').textContent='عدد الطلبات: '+d.reviews.length;document.getElementById('queue').innerHTML=d.reviews.map(s=>'<article data-revision="'+esc(s.revisionId)+'"><p class="muted">'+esc(s.salonName)+' — '+esc(s.area)+'</p><h2>'+esc(s.name)+'</h2><p>القسم: '+esc(categories[s.category])+'</p>'+(s.mediaUrl?(s.mediaType.startsWith('video/')?'<video controls muted playsinline preload="metadata" src="'+esc(s.mediaUrl)+'"></video>':'<img src="'+esc(s.mediaUrl)+'" alt="وسائط الخدمة">'):'')+'<p>السعر الأصلي: '+s.price.toLocaleString('en-US')+' د.ع · المدة: '+s.minutes+' دقيقة</p>'+(s.discount?'<p>السعر الجديد: '+s.discount.price.toLocaleString('en-US')+' د.ع</p><p>بداية الخصم: '+esc(new Date(s.discount.startsAt).toLocaleString('ar-IQ'))+'<br>نهاية الخصم: '+esc(new Date(s.discount.endsAt).toLocaleString('ar-IQ'))+'</p>':'')+'<p>'+(s.active?'نشر الخدمة بعد الموافقة':'طلب إخفاء الخدمة')+'</p><p class="muted">'+(s.publishedRevisionId?'تعديل — تبقى النسخة السابقة منشورة حتى الاعتماد':'خدمة جديدة — غير منشورة')+'</p><label>سبب الرفض</label><textarea maxlength="500"></textarea><button data-action="approve">موافقة ونشر</button><button class="secondary" data-action="reject">رفض</button></article>').join('')||'<div class="panel">لا توجد طلبات بانتظار المراجعة.</div>'}catch(e){document.getElementById('message').textContent=e.message}}
document.getElementById('queue').addEventListener('click',async e=>{const button=e.target.closest('button[data-action]');if(!button||adminBusy)return;const article=button.closest('article');const reason=article.querySelector('textarea').value;if(button.dataset.action==='reject'&&!reason.trim()){document.getElementById('message').textContent='اكتبي سبب الرفض.';return}adminBusy=true;article.querySelectorAll('button').forEach(b=>b.disabled=true);try{await api('reviews/'+article.dataset.revision,{action:button.dataset.action,reason});await loadReviews()}catch(error){document.getElementById('message').textContent=error.message;article.querySelectorAll('button').forEach(b=>b.disabled=false)}finally{adminBusy=false}});
accountView();void(async()=>{try{const d=await api('me');if(d.account.role==='admin'){user=d.account;accountView();await loadReviews()}}catch{}})();
setInterval(()=>{if(user&&!document.hidden&&!adminBusy&&!document.getElementById('queue').contains(document.activeElement))void loadReviews()},30000);
</script></body></html>
