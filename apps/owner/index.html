}label{display:block;margin:12px 0 6px;color:var(--pink2)}textarea{min-height:75px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);background:#191218f5;border-top:1px solid #654455;padding:9px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}nav button{background:transparent;color:#bba9b1;padding:8px 0;font-size:11px;font-weight:normal}nav button.active{color:var(--pink);font-weight:bold}nav span{display:block;font-size:22px;margin-bottom:5px}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.hidden{display:none!important}.empty{padding:25px 10px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.switch{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.switch input{width:20px;height:20px;accent-color:var(--pink)}.thumb{width:62px;height:62px;border-radius:13px;object-fit:cover;background:#382735}.notice{border:1px solid #74516a;background:#30202c;border-radius:13px;padding:12px;margin:10px 0;font-size:12px}.money{color:var(--pink);font-weight:bold}.full{width:100%}.imagepreview{width:100%;height:145px;object-fit:cover;border-radius:15px;margin:10px 0}#toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#f3a3bb;color:#201019;border-radius:14px;padding:12px 17px;display:none;max-width:90%;z-index:10;text-align:center}

function applyTheme(theme){
  let root=document.documentElement;
  if(theme==='rose'){
    root.style.setProperty('--bg','#fbf6f7');
    root.style.setProperty('--outside','#f5e8eb');
    root.style.setProperty('--card','#ffffff');
    root.style.setProperty('--line','#ebd8de');
    root.style.setProperty('--pink','#c44d70');
    root.style.setProperty('--soft','#fcebed');
    root.style.setProperty('--tint','#fcebed');
    root.style.setProperty('--text','#3d2b30');
    root.style.setProperty('--muted','#947880');
    root.dataset.themeMode='light';
  }else{
    root.style.setProperty('--bg','#f3ebfa');
    root.style.setProperty('--outside','#e6d5fa');
    root.style.setProperty('--card','#ffffff');
    root.style.setProperty('--line','#d9baff');
    root.style.setProperty('--pink','#4b0c9b');
    root.style.setProperty('--soft','#eee0f8');
    root.style.setProperty('--tint','#ebd8fc');
    root.style.setProperty('--text','#250743');
    root.style.setProperty('--muted','#70518e');
    root.dataset.themeMode='light';
  }
}
let ownerTheme='lavender';try{ownerTheme=localStorage.getItem('salonati_owner_theme')||JSON.parse(localStorage.getItem('salonati_theme')||'"lavender"')}catch{}
function setOwnerTheme(value){ownerTheme=value==='rose'?'rose':'lavender';applyTheme(ownerTheme);document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();document.querySelector('#owner-theme-toggle')?.setAttribute('aria-pressed',String(ownerTheme==='rose'))}
function toggleOwnerTheme(){setOwnerTheme(ownerTheme==='rose'?'lavender':'rose');try{localStorage.setItem('salonati_owner_theme',ownerTheme)}catch{}}
setOwnerTheme(ownerTheme);
const ownerAds=[{title:'منتجات العناية بالشعر',copy:'اكتشفي منتجات العناية والترطيب',symbol:'♧'},{title:'العناية بالبشرة',copy:'منتجات لروتين العناية اليومي',symbol:'✿'},{title:'جمال الأظافر',copy:'اكتشفي مجموعة العناية بالأظافر',symbol:'✧'}];
let ownerAdIndex=0;
const ownerMotion=matchMedia('(prefers-reduced-motion: reduce)');
function ownerAdMarkup(){const ad=ownerAds[ownerAdIndex];return '<small>إعلانات إدارة التطبيق</small><div class="owner-ad-slide"><span class="ad-product-art" aria-hidden="true">'+ad.symbol+'</span><h2>'+esc(ad.title)+'</h2><p>'+esc(ad.copy)+'</p></div>'}
function paintOwnerAd(){document.querySelectorAll('[data-management-ad]').forEach(node=>node.innerHTML=ownerAdMarkup());const node=document.getElementById('owner-product-ad');if(node)node.innerHTML=ownerAdMarkup()}
setInterval(()=>{if((!document.getElementById('owner-product-ad')&&!document.querySelector('[data-management-ad]'))||ownerMotion.matches||document.hidden)return;ownerAdIndex=(ownerAdIndex+1)%ownerAds.length;paintOwnerAd()},5000);


let bookingScannerStream=null,bookingScannerTimer=null,bookingScannerGeneration=0,bookingQRLoader=null;
function scannerPanel(){return '<section class="card booking-scanner"><div class="reception-options"><div class="reception-scan"><h3>ماسح الباركود / QR</h3><p class="muted">وجّهي الكاميرا إلى رمز الحجز.</p><video id="bookingScanVideo" autoplay muted playsinline hidden aria-label="كاميرا مسح الرمز"></video><div class="actions"><button type="button" id="bookingScanStart" onclick="startBookingScanner()">فتح الماسح</button><button type="button" class="secondary" id="bookingScanStop" onclick="stopBookingScanner();scannerMessage(\'تم إيقاف الكاميرا\')" hidden>إيقاف الكاميرا</button></div></div><div class="reception-payment"><h3>الدفع الإلكتروني</h3><button type="button" onclick="openElectronicPayment()">فتح الدفع</button></div></div><p id="bookingScanMessage" role="status" aria-live="polite"></p><div id="bookingScanResult" hidden><label>محتوى الرمز</label><pre id="bookingScanValue" dir="auto"></pre></div></section>'}
function openElectronicPayment(){stopBookingScanner();let dialog=document.getElementById('electronicPaymentDialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='electronicPaymentDialog';dialog.setAttribute('aria-labelledby','paymentDialogTitle');dialog.innerHTML='<h2 id="paymentDialogTitle">الدفع الإلكتروني</h2><p>لم يتم ربط بوابة الدفع بعد.</p><form method="dialog"><button>إغلاق</button></form>';document.body.append(dialog)}dialog.showModal()}
function scannerMessage(message){const el=document.getElementById('bookingScanMessage');if(el)el.textContent=message}
function stopBookingScanner(){bookingScannerGeneration++;clearTimeout(bookingScannerTimer);bookingScannerTimer=null;if(bookingScannerStream){bookingScannerStream.getTracks().forEach(t=>t.stop());bookingScannerStream=null}const v=document.getElementById('bookingScanVideo');if(v){v.pause();v.srcObject=null;v.hidden=true}const start=document.getElementById('bookingScanStart'),stop=document.getElementById('bookingScanStop');if(start)start.disabled=false;if(stop)stop.hidden=true}
function displayBookingScan(raw){const value=String(raw||'').trim();if(!value||value.length>8192)return false;stopBookingScanner();void submitReceptionScan(value);return true}
async function submitReceptionScan(value){
 const output=document.getElementById('bookingScanValue'),box=document.getElementById('bookingScanResult');
 if(!/^SLB1\.[a-zA-Z0-9-]{1,128}\.[a-f0-9]{64}$/.test(value)){scannerMessage('هذا الرمز ليس رمز حجز صالوناتي صالحًا.');return}
 scannerMessage('جارٍ التحقق من الحجز وتسجيل الاستقبال…');
 try{const response=await fetch('/api/owner/bookings/start',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:value})});const data=await response.json();
 if(!response.ok){scannerMessage(response.status===401?'يلزم تسجيل الدخول بحساب الصالون لتأكيد الاستقبال.':response.status===403?'هذا الحساب غير مخول باستقبال الحجز.':response.status===409?'الرمز مستخدم أو منتهي، أو الحجز غير متاح للاستقبال.':response.status===503?'خدمة استقبال الحجوزات غير متاحة حاليًا.':'تعذر التحقق من الحجز. لم يُسجّل الاستقبال.');return}
 if(data.status!=='in_progress'||!data.id)throw Error('invalid_response');
 if(output&&box&&document.body.contains(box)){output.textContent='رقم الحجز: '+data.id;box.hidden=false;scannerMessage('تم تسجيل استقبال الزبونة وإشعار الإدارة بنجاح.')}
 }catch{scannerMessage('تعذر الاتصال بخدمة الحجوزات. لم يُسجّل الاستقبال.')}
}
function loadBookingQR(){if(window.jsQR)return Promise.resolve();if(!bookingQRLoader)bookingQRLoader=new Promise((resolve,reject)=>{const script=document.createElement('script');const timeout=setTimeout(()=>{script.remove();bookingQRLoader=null;reject(Error('decoder'))},12000);script.src='/vendor/jsQR.js';script.onload=()=>{clearTimeout(timeout);if(window.jsQR)resolve();else{bookingQRLoader=null;script.remove();reject(Error('decoder'))}};script.onerror=()=>{clearTimeout(timeout);script.remove();bookingQRLoader=null;reject(Error('decoder'))};document.head.append(script)});return bookingQRLoader}
async function startBookingScanner(){
 stopBookingScanner();const generation=bookingScannerGeneration;
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){scannerMessage('الكاميرا غير متاحة في هذا المتصفح. افتحي الرابط مباشرة في متصفح الهاتف.');return}
 const start=document.getElementById('bookingScanStart');if(start)start.disabled=true;
 const result=document.getElementById('bookingScanResult');if(result)result.hidden=true;
 scannerMessage('يُرجى السماح باستخدام الكاميرا…');
 let detector=null;
 try{
  if('BarcodeDetector' in window)try{const supported=await BarcodeDetector.getSupportedFormats();const formats=['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','codabar','data_matrix','aztec','pdf417'].filter(x=>supported.includes(x));if(formats.length)detector=new BarcodeDetector({formats})}catch{}
  if(!detector)await loadBookingQR();
  if(generation!==bookingScannerGeneration||!document.getElementById('bookingScanVideo'))return;
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  if(generation!==bookingScannerGeneration||!document.getElementById('bookingScanVideo')||document.hidden){stream.getTracks().forEach(t=>t.stop());return}
  bookingScannerStream=stream;const video=document.getElementById('bookingScanVideo');video.srcObject=stream;video.hidden=false;await video.play();
  if(generation!==bookingScannerGeneration)return;
  document.getElementById('bookingScanStop').hidden=false;scannerMessage(detector?'وجّهي الكاميرا إلى الباركود أو رمز QR':'وجّهي الكاميرا إلى رمز QR');
  const canvas=document.createElement('canvas'),context=canvas.getContext('2d',{willReadFrequently:true});
  const scan=async()=>{if(generation!==bookingScannerGeneration)return;try{if(video.readyState>=2&&video.videoWidth){let value;if(detector){const codes=await detector.detect(video);value=codes[0]?.rawValue}else{const scale=Math.min(1,960/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);context.drawImage(video,0,0,canvas.width,canvas.height);const frame=context.getImageData(0,0,canvas.width,canvas.height);value=window.jsQR(frame.data,frame.width,frame.height,{inversionAttempts:'attemptBoth'})?.data}if(generation!==bookingScannerGeneration)return;if(value&&displayBookingScan(value))return}}catch{if(generation===bookingScannerGeneration){stopBookingScanner();scannerMessage('تعذرت قراءة الكاميرا. حاولي فتح الماسح مجددًا.')}return}if(generation===bookingScannerGeneration)bookingScannerTimer=setTimeout(scan,180)};
  void scan();
 }catch(error){if(generation!==bookingScannerGeneration)return;stopBookingScanner();scannerMessage(error.name==='NotAllowedError'?'لم يُسمح باستخدام الكاميرا. فعّلي إذن الكاميرا من إعدادات المتصفح.':error.name==='NotFoundError'?'لم يتم العثور على كاميرا.':error.name==='NotReadableError'?'الكاميرا مشغولة. أغلقي التطبيقات التي تستخدمها وحاولي مجددًا.':'تعذر تشغيل الماسح. تحققي من الاتصال وإذن الكاميرا وحاولي مجددًا.')}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopBookingScanner()});
window.addEventListener('pagehide',stopBookingScanner);


const serviceMediaCache=new Map();
let serviceMediaDatabase;
function openServiceMediaDB(){if(!serviceMediaDatabase)serviceMediaDatabase=new Promise((resolve,reject)=>{const request=indexedDB.open('salonati-owner-service-media',1);request.onupgradeneeded=()=>request.result.createObjectStore('media');request.onsuccess=()=>resolve(request.result);request.onerror=()=>{serviceMediaDatabase=null;reject(request.error)}});return serviceMediaDatabase}
async function serviceMediaStore(mode,key,value){const database=await openServiceMediaDB();return new Promise((resolve,reject)=>{const tx=database.transaction('media',mode),store=tx.objectStore('media');const request=mode==='readonly'?store.get(key):value===undefined?store.delete(key):store.put(value,key);let result;request.onsuccess=()=>result=request.result;tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function allowedServiceFile(file){return ['image/jpeg','image/png','image/gif','image/webp','video/mp4','video/webm'].includes(file.type)&&file.size<=20*1024*1024}
function serviceMediaMarkup(service){const media=serviceMediaCache.get(service.mediaKey);if(!media)return '';return media.type.startsWith('video/')?'<video class="service-media" src="'+esc(media.url)+'" controls muted loop playsinline preload="metadata"></video>':'<img class="service-media" src="'+esc(media.url)+'" alt="'+esc(service.name)+'">'}
async function hydrateServiceMedia(){let changed=false;for(const service of db.services){if(!service.mediaKey||serviceMediaCache.has(service.mediaKey))continue;try{const file=await serviceMediaStore('readonly',service.mediaKey);if(file&&allowedServiceFile(file)){serviceMediaCache.set(service.mediaKey,{type:file.type,url:URL.createObjectURL(file)});changed=true}}catch{}}if(changed&&page==='services')render()}
function previewServiceUpload(){const input=document.getElementById('serviceFile'),container=document.getElementById('serviceUploadPreview'),file=input?.files[0];if(!container)return;if(container.dataset.url)URL.revokeObjectURL(container.dataset.url);container.replaceChildren();delete container.dataset.url;if(!file)return;if(!allowedServiceFile(file)){input.value='';toast('اختاري صورة JPG أو PNG أو GIF أو WebP، أو فيديو MP4 أو WebM، بحجم لا يتجاوز 20 ميغابايت');return}const media=document.createElement(file.type.startsWith('video/')?'video':'img');const url=URL.createObjectURL(file);container.dataset.url=url;media.src=url;media.className='service-media';if(media instanceof HTMLVideoElement){media.controls=true;media.muted=true;media.loop=true;media.playsInline=true}else media.alt='معاينة وسائط الخدمة';container.append(media)}
function chooseServiceEditor(value){const preview=document.getElementById('serviceUploadPreview');if(preview?.dataset.url)URL.revokeObjectURL(preview.dataset.url);edit=value==='new'?null:{kind:'service',obj:db.services.find(s=>String(s.id)===value)};render()}
function activeServiceDiscount(service,now=Date.now()){return !!(service.discount&&service.discount.price>0&&service.discount.price<service.price&&Date.parse(service.discount.startsAt)<=now&&now<Date.parse(service.discount.endsAt))}
function servicePriceMarkup(service){return activeServiceDiscount(service)?'<del class="muted">'+fmt(service.price)+'</del> <b class="money">'+fmt(service.discount.price)+'</b>':'<b class="money">'+fmt(service.price)+'</b>'}
function localDateInput(value){if(!value)return '';const d=new Date(value);if(!Number.isFinite(d.getTime()))return '';return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function toggleServiceDiscountForm(){document.getElementById('serviceDiscountFields').hidden=!document.getElementById('serviceHasDiscount').checked}

const KEY='salonati-owner-v2';
const initial={salon:{name:'صالون لؤلؤة بغداد',area:'الكرادة',address:'بغداد، الكرادة',phone:'07700000000',about:'جمالُك يبدأ من هنا',lat:'33.302',lng:'44.432',open:true},services:[{id:1,name:'قص وتصفيف الشعر',price:25000,minutes:60,active:true},{id:2,name:'صبغ الشعر',price:60000,minutes:90,active:true},{id:3,name:'مناكير جل',price:15000,minutes:45,active:true},{id:4,name:'عناية بالوجه',price:50000,minutes:60,active:true}],bookings:[{id:1001,name:'سارة أحمد',phone:'07712345678',services:[1,3],date:'2026-10-23',time:'11:30',status:'pending',notes:'أرغب بموعد صباحي'},{id:1002,name:'نور علي',phone:'07812345678',services:[2],date:'2026-10-24',time:'14:00',status:'accepted',notes:''}],products:[{id:1,name:'زيت ترطيب الشعر',price:18000,stock:8,description:'منتج للعناية بالشعر'}],staff:[{id:1,name:'زينب',role:'تصفيف الشعر'},{id:2,name:'رنا',role:'العناية بالبشرة'}],hours:[{day:'السبت',open:'10:00',close:'20:00',enabled:true},{day:'الأحد',open:'10:00',close:'20:00',enabled:true},{day:'الاثنين',open:'10:00',close:'20:00',enabled:true},{day:'الثلاثاء',open:'10:00',close:'20:00',enabled:true},{day:'الأربعاء',open:'10:00',close:'20:00',enabled:true},{day:'الخميس',open:'10:00',close:'21:00',enabled:true},{day:'الجمعة',open:'12:00',close:'19:00',enabled:false}],photos:[],blocked:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=JSON.parse(JSON.stringify(initial))}
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n||0).toLocaleString('en-US')+' د.ع',val=id=>document.getElementById(id)?.value?.trim(),id=()=>Date.now(),status={pending:'بانتظار الموافقة',accepted:'مقبول',rejected:'مرفوض',cancelled:'ملغي',completed:'مكتمل'},tabs=[['home','الرئيسية','⌂'],['bookings','الحجوزات','▦'],['services','الخدمات','✂'],['products','المنتجات','▣'],['more','المزيد','☰']];
let page='home',filter='all',edit=null;
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function button(label,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function booking(b){let ss=b.services.map(i=>db.services.find(s=>s.id==i)?.name||'خدمة محذوفة').join(' + '),sum=b.services.reduce((n,i)=>n+(db.services.find(s=>s.id==i)?.price||0),0);return `<div class="card"><div class="between"><h3>${esc(b.name)}</h3><span class="tag ${b.status==='accepted'?'ok':b.status==='rejected'?'no':''}">${status[b.status]}</span></div><div class="muted">${esc(ss)}</div><p>📅 ${esc(b.date)} &nbsp; 🕒 ${esc(b.time)}</p><div class="between"><b class="money">${fmt(sum)}</b><small>طلب #${b.id}</small></div>${b.notes?`<p class="muted">ملاحظة: ${esc(b.notes)}</p>`:''}${b.status==='pending'?`<div class="actions">${button('قبول','changeBooking('+b.id+', "accepted")','')}${button('رفض','changeBooking('+b.id+', "rejected")','danger')}</div>`:`<div class="actions">${b.status==='accepted'?`<span>📞 ${esc(b.phone)}</span>${button('مكتمل','changeBooking('+b.id+', "completed")','')}`:''}</div>`}</div>`}
function home(){let pend=db.bookings.filter(x=>x.status==='pending');return `<div class="hero"><div class="hero-layout"><div><small>أهلاً بك في إدارة صالونك</small><p><strong>${esc(db.salon.name)}</strong></p><div class="salon-location"><small>📍 ${esc(db.salon.area)}</small><span class="tag ${db.salon.open?'ok':'no'}">${db.salon.open?'يستقبل الحجوزات':'الحجوزات متوقفة'}</span></div></div><section id="owner-product-ad" class="owner-ad" aria-label="إعلانات إدارة التطبيق">${ownerAdMarkup()}</section></div></div><div class="stats"><div class="stat"><small>بانتظار الرد</small><b>${pend.length}</b></div><div class="stat"><small>المقبولة</small><b>${db.bookings.filter(x=>x.status==='accepted').length}</b></div><div class="stat"><small>الخدمات</small><b>${db.services.filter(x=>x.active).length}</b></div></div><h2>الاستقبال</h2>${scannerPanel()}<h2>طلبات الحجز الجديدة</h2>${pend.length?pend.map(booking).join(''):'<div class="empty">لا توجد طلبات جديدة</div>'}`}
function bookings(){let a=filter==='all'?db.bookings:db.bookings.filter(x=>x.status===filter);return `<h2>إدارة الحجوزات</h2><div class="tabs">${[['all','الكل'],['pending','الجديدة'],['accepted','المقبولة'],['completed','المكتملة'],['rejected','المرفوضة']].map(([k,v])=>button(v,`setFilter('${k}')`,filter===k?'':'secondary')).join('')}</div>${a.length?a.slice().reverse().map(booking).join(''):'<div class="empty">لا توجد حجوزات بهذا التصنيف</div>'}`}
function services(){const selected=edit?.kind==='service'?edit.obj:null;return `<h2>الخدمات والأسعار</h2>${db.services.map(s=>`<div class="card">${serviceMediaMarkup(s)}<div class="between"><div><h3>${esc(s.name)}</h3><small>${s.minutes} دقيقة • ${servicePriceMarkup(s)}</small>${s.discount?`<p class="service-discount-period small">${activeServiceDiscount(s)?'خصم ساري':'فترة الخصم'}: ${esc(new Date(s.discount.startsAt).toLocaleString('ar-IQ'))} — ${esc(new Date(s.discount.endsAt).toLocaleString('ar-IQ'))}</p>`:''}</div><span class="tag ${s.active?'ok':'no'}">${s.active?'متاحة':'مخفية'}</span></div><div class="actions">${button('تعديل',`editService(${s.id})`)}${button(s.active?'إخفاء':'إظهار',`toggleService(${s.id})`)}${button('حذف',`deleteService(${s.id})`,'danger')}</div></div>`).join('')}<details class="service-editor-fold" ${selected?'open':''}><summary>إضافة أو تعديل خدمة</summary><div class="card"><label for="serviceEditorChoice">اختيار الخدمة</label><select id="serviceEditorChoice" onchange="chooseServiceEditor(this.value)"><option value="new">جديد — إضافة خدمة</option>${db.services.map(s=>`<option value="${s.id}" ${selected?.id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label for="sname">اسم الخدمة</label><input id="sname" value="${esc(selected?.name||'')}" placeholder="اسم الخدمة"><div class="two"><div><label for="sprice">السعر الأصلي بالدينار</label><input id="sprice" type="number" min="0" step="1" value="${selected?.price??''}"></div><div><label for="sminutes">المدة بالدقائق</label><input id="sminutes" type="number" min="1" step="1" value="${selected?.minutes??60}"></div></div><label for="serviceFile">صورة أو فيديو أو صورة متحركة</label><input id="serviceFile" type="file" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm" onchange="previewServiceUpload()"><div id="serviceUploadPreview">${selected?serviceMediaMarkup(selected):''}</div><label class="switch" for="serviceHasDiscount"><span>إضافة خصم</span><input id="serviceHasDiscount" type="checkbox" ${selected?.discount?'checked':''} onchange="toggleServiceDiscountForm()"></label><div id="serviceDiscountFields" ${selected?.discount?'':'hidden'}><label for="serviceDiscountPrice">السعر الجديد بعد الخصم</label><input id="serviceDiscountPrice" type="number" min="1" step="1" value="${selected?.discount?.price??''}"><label for="serviceDiscountStart">بداية الخصم</label><input id="serviceDiscountStart" type="datetime-local" value="${localDateInput(selected?.discount?.startsAt)}"><label for="serviceDiscountEnd">نهاية الخصم</label><input id="serviceDiscountEnd" type="datetime-local" value="${localDateInput(selected?.discount?.endsAt)}"></div><div class="actions"><button id="saveServiceButton" type="button" onclick="saveService()">حفظ الخدمة</button>${selected?button('إلغاء','clearEdit()'):''}</div></div></details>`}

function products(){return `<h2>منتجات الصالون</h2>${db.products.map(p=>`<div class="card"><div class="between"><div><h3>${esc(p.name)}</h3><small>${esc(p.description)}</small><p class="money">${fmt(p.price)} • الكمية ${p.stock}</p></div><div class="actions">${button('تعديل',`editProduct(${p.id})`)}${button('حذف',`deleteProduct(${p.id})`,'danger')}</div></div></div>`).join('')}<h2>${edit?.kind==='product'?'تعديل منتج':'إضافة منتج'}</h2><div class="card"><label>اسم المنتج</label><input id="pname" value="${esc(edit?.kind==='product'?edit.obj.name:'')}"><label>الوصف</label><textarea id="pdesc">${esc(edit?.kind==='product'?edit.obj.description:'')}</textarea><div class="two"><div><label>السعر</label><input id="pprice" type="number" min="0" value="${edit?.kind==='product'?edit.obj.price:''}"></div><div><label>الكمية</label><input id="pstock" type="number" min="0" value="${edit?.kind==='product'?edit.obj.stock:0}"></div></div>${button('حفظ المنتج','saveProduct()','')}</div>`}
function more(){return `<h2>لون التطبيق</h2><div class="card"><button id="owner-theme-toggle" class="full secondary" type="button" onclick="toggleOwnerTheme()" aria-label="تبديل لون التطبيق" aria-pressed="${ownerTheme==='rose'}">◐ تبديل لون التطبيق</button></div><h2>بيانات الصالون</h2><div class="card"><label>اسم الصالون</label><input id="name" value="${esc(db.salon.name)}"><label>المنطقة</label><input id="area" value="${esc(db.salon.area)}"><label>العنوان</label><input id="address" value="${esc(db.salon.address)}"><label>هاتف الصالون</label><input id="phone" value="${esc(db.salon.phone)}"><label>نبذة</label><textarea id="about">${esc(db.salon.about)}</textarea><div class="two"><div><label>خط العرض</label><input id="lat" value="${esc(db.salon.lat)}"></div><div><label>خط الطول</label><input id="lng" value="${esc(db.salon.lng)}"></div></div><div class="switch"><span>استقبال حجوزات جديدة</span><input id="open" type="checkbox" ${db.salon.open?'checked':''}></div>${button('حفظ بيانات الصالون','saveSalon()','')}</div><h2>أوقات الدوام</h2>${db.hours.map((h,i)=>`<div class="card"><div class="between"><b>${h.day}</b><label class="row" style="margin:0"><input style="width:18px" type="checkbox" id="enabled${i}" ${h.enabled?'checked':''}> مفتوح</label></div><div class="two"><div><label>من</label><input type="time" id="from${i}" value="${h.open}"></div><div><label>إلى</label><input type="time" id="to${i}" value="${h.close}"></div></div></div>`).join('')}${button('حفظ أوقات الدوام','saveHours()','full')}<h2>فريق العمل</h2>${db.staff.map(x=>`<div class="card between"><div><b>${esc(x.name)}</b><p class="muted">${esc(x.role)}</p></div>${button('حذف',`deleteStaff(${x.id})`,'danger')}</div>`).join('')}<div class="card"><label>اسم الموظفة</label><input id="staffName"><label>الاختصاص</label><input id="staffRole">${button('إضافة موظفة','addStaff()','')}</div><h2>معرض صور الصالون</h2>${db.photos.map((src,i)=>`<div class="card"><img class="imagepreview" src="${src}" alt="صورة الصالون">${button('حذف الصورة',`deletePhoto(${i})`,'danger')}</div>`).join('')}<div class="card"><input type="file" id="photo" accept="image/*"><div class="actions">${button('إضافة الصورة','addPhoto()','')}</div></div><h2>النسخ الاحتياطي</h2><div class="card">${button('تصدير نسخة احتياطية JSON','backup()') }<label>استعادة نسخة احتياطية</label><input type="file" id="restore" accept=".json,application/json"><div class="actions">${button('استعادة','restoreData()')}</div></div>`}
function render(){stopBookingScanner();const headerLogo=document.querySelector('header .logo');if(headerLogo){headerLogo.classList.toggle('service-header-ad',page==='services');headerLogo.innerHTML=page==='services'?'<section data-management-ad aria-label="إعلانات إدارة التطبيق">'+ownerAdMarkup()+'</section>':'✿'}document.getElementById('salonTitle').textContent=db.salon.name;document.getElementById('main').innerHTML=({home,bookings,services,products,more})[page]();document.getElementById('nav').innerHTML=tabs.map(([k,n,ic])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span>${ic}</span>${n}</button>`).join('')}
function go(x){page=x;edit=null;render();scrollTo(0,0)}function setFilter(x){filter=x;render()}function clearEdit(){edit=null;render()}
function changeBooking(i,s){let b=db.bookings.find(x=>x.id===i);if(!b)return;b.status=s;save();toast('تم تحديث حالة الحجز')}
function editService(i){edit={kind:'service',obj:db.services.find(x=>x.id===i)};render();document.getElementById('sname').scrollIntoView({behavior:'smooth'})}
async function saveService(){
 const name=val('sname'),price=Number(val('sprice')),minutes=Number(val('sminutes')),file=document.getElementById('serviceFile')?.files[0],hasDiscount=document.getElementById('serviceHasDiscount').checked;
 if(!name||!val('sprice')||!Number.isSafeInteger(price)||price<0||!Number.isSafeInteger(minutes)||minutes<1)return toast('أدخلي اسم الخدمة والسعر والمدة بشكل صحيح');
 let discount=null;if(hasDiscount){const newPrice=Number(val('serviceDiscountPrice')),start=Date.parse(val('serviceDiscountStart')),end=Date.parse(val('serviceDiscountEnd'));if(!Number.isSafeInteger(newPrice)||newPrice<=0||newPrice>=price||!Number.isFinite(start)||!Number.isFinite(end)||end<=start)return toast('تحققي من السعر الجديد وبداية الخصم ونهايته');discount={price:newPrice,startsAt:new Date(start).toISOString(),endsAt:new Date(end).toISOString()}}
 if(file&&!allowedServiceFile(file))return toast('صيغة الوسائط أو حجمها غير مناسب');
 const old=edit?.kind==='service'?edit.obj:null,newService={...(old||{id:id(),active:true}),name,price,minutes,discount},button=document.getElementById('saveServiceButton');if(button)button.disabled=true;
 try{if(file){newService.mediaKey='service-'+crypto.randomUUID();await serviceMediaStore('readwrite',newService.mediaKey,file);serviceMediaCache.set(newService.mediaKey,{type:file.type,url:URL.createObjectURL(file)})}
 const next={...db,services:old?db.services.map(s=>s.id===old.id?newService:s):[...db.services,newService]};localStorage.setItem(KEY,JSON.stringify(next));db=next;const preview=document.getElementById('serviceUploadPreview');if(preview?.dataset.url)URL.revokeObjectURL(preview.dataset.url);edit=null;render();toast('تم حفظ الخدمة');
 }catch{if(button)button.disabled=false;toast('تعذر حفظ الخدمة أو الوسائط. تحققي من مساحة التخزين وحاولي مجددًا')}
}

function toggleService(i){let s=db.services.find(x=>x.id===i);s.active=!s.active;save()}
function deleteService(i){if(!confirm('حذف هذه الخدمة؟ ستبقى بيانات الحجوزات القديمة.'))return;db.services=db.services.filter(x=>x.id!==i);save()}
function editProduct(i){edit={kind:'product',obj:db.products.find(x=>x.id===i)};render();document.getElementById('pname').scrollIntoView({behavior:'smooth'})}
function saveProduct(){let name=val('pname'),price=Number(val('pprice')),stock=Number(val('pstock'));if(!name||!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0)return toast('تحققي من بيانات المنتج');let o={name,price,stock,description:val('pdesc')};if(edit?.kind==='product')Object.assign(edit.obj,o);else db.products.push({id:id(),...o});edit=null;save();toast('تم حفظ المنتج')}
function deleteProduct(i){if(confirm('حذف المنتج؟')){db.products=db.products.filter(x=>x.id!==i);save()}}
function saveSalon(){for(let k of ['name','area','address','phone','about','lat','lng'])db.salon[k]=val(k);db.salon.open=document.getElementById('open').checked;save();toast('تم حفظ بيانات الصالون')}
function saveHours(){db.hours.forEach((h,i)=>{h.enabled=document.getElementById('enabled'+i).checked;h.open=val('from'+i);h.close=val('to'+i)});save();toast('تم حفظ الدوام')}
function addStaff(){if(!val('staffName'))return toast('أدخلي الاسم');db.staff.push({id:id(),name:val('staffName'),role:val('staffRole')});save()}
function deleteStaff(i){db.staff=db.staff.filter(x=>x.id!==i);save()}
function deletePhoto(i){db.photos.splice(i,1);save()}
function addPhoto(){let f=document.getElementById('photo').files[0];if(!f)return toast('اختاري صورة');if(f.size>750000)return toast('اختاري صورة أصغر من 750 كيلوبايت');let r=new FileReader();r.onload=()=>{db.photos.push(r.result);try{save()}catch(e){db.photos.pop();toast('مساحة التخزين المحلي ممتلئة')}};r.readAsDataURL(f)}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='salonati-owner-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreData(){let f=document.getElementById('restore').files[0];if(!f)return toast('اختاري ملف JSON');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.salon||!Array.isArray(d.services)||!Array.isArray(d.bookings))throw Error();if(confirm('استبدال البيانات الحالية؟')){db=d;save()}}catch(e){toast('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(f)}
render();void hydrateServiceMedia();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
