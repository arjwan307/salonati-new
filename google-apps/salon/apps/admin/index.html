function empty(t){return '<p class="empty">'+esc(t)+'</p>'}function field(name,label,value='',type='text',extra=''){return '<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></label>'}

if(page==='salon'&&selectedSalon){const s=catalog.salons.find(x=>x.id===selectedSalon);if(!s)return empty('الصالون غير متاح');return '<button class="small soft" data-page="home">رجوع</button><h2>'+esc(s.name)+'</h2><p>'+esc(s.area)+'</p><div class="tabs">'+Object.entries({...cats,product:'المنتجات',offer:'العروض',work:'الأعمال'}).map(([k,n])=>'<button class="soft small" data-category="'+k+'">'+n+'</button>').join('')+'</div>'+(['product','offer','work'].includes(selectedCategory)?content.filter(x=>x.salon_id===s.id&&x.kind===selectedCategory).map(x=>mediaCard(x)).join(''):serviceCards(catalog.services.filter(x=>x.salon_id===s.id&&(!selectedCategory||x.category===selectedCategory))))+(basket.length?'<article><h3>الخدمات المختارة ('+basket.length+')</h3><p>'+basket.map(id=>esc(catalog.services.find(s=>s.id===id)?.name)).join(' + ')+'</p><button data-page="checkout">متابعة الحجز</button></article>':'');}
if(page==='checkout'){if(!me)return auth();const list=basket.map(id=>catalog.services.find(s=>s.id===id)).filter(Boolean);if(!list.length)return empty('اختاري خدمة أولًا');const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Baghdad'});const times=Array.from({length:18},(_,i)=>{const h=9+Math.floor(i/2),m=i%2?'30':'00';return [''+String(h).padStart(2,'0')+':'+m,((h-1)%12+1)+':'+m+(h<12?' صباحًا':' مساءً')]});return '<h2>تأكيد الحجز</h2><article>'+list.map(s=>'<p>'+esc(s.name)+' · '+money(s.price)+'</p>').join('')+'<p class="price">الإجمالي: '+money(list.reduce((a,s)=>a+s.price,0))+'</p>'+form('booking',field('date','التاريخ',today,'date','required min="'+today+'"')+'<label>الوقت<select name="time">'+times.map(([v,t])=>'<option value="'+v+'">'+t+'</option>').join('')+'</select></label>','إرسال طلب الحجز')+'</article>';}
return '<div class="hero"><small>أهلًا بكِ في صالوناتي</small><h2>جمالكِ يبدأ بموعد يناسبكِ</h2><p class="muted">صالونات وخدمات مسجلة فعليًا</p></div>'+adBlock()+'<h2>التصنيفات</h2><div class="tabs">'+Object.entries(cats).map(([k,n])=>'<button class="soft small" data-home-category="'+k+'">'+n+'</button>').join('')+'<button class="small" data-page="offers">الخصومات</button></div><h2>الصالونات</h2>'+salonCards(selectedCategory?catalog.salons.filter(s=>catalog.services.some(x=>x.salon_id===s.id&&x.category===selectedCategory)):catalog.salons);}
function owner(){if(!me)return auth(page==='register');if(me.status!=='active')return '<article><h2>حسابكِ بانتظار موافقة الإدارة</h2><p>بعد الموافقة يظهر الصالون للزبونات ويمكنكِ إضافة الخدمات واستقبال الحجوزات.</p><button data-action="refresh">تحقق من الموافقة</button></article>'+profile();if(page==='profile')return profile();if(page==='services')return '<h2>الخدمات والأسعار</h2>'+serviceForm()+serviceCards(catalog.services);if(page==='products')return '<h2>منتجات الصالون</h2>'+contentForm('product')+content.filter(x=>x.kind==='product').map(x=>mediaCard(x,true)).join('');if(page==='media')return '<h2>العروض والأعمال والكادر</h2><div class="tabs">'+['offer','work','staff'].map(k=>'<button class="small soft" data-kind="'+k+'">'+({offer:'العروض',work:'الأعمال',staff:'الكادر'}[k])+'</button>').join('')+'</div>'+contentForm(['offer','work','staff'].includes(selectedCategory)?selectedCategory:'offer')+content.filter(x=>x.kind!=='product').map(x=>mediaCard(x,true)).join('');return adBlock()+'<h2>طلبات الحجز</h2>'+bookingCards();}
function admin(){if(!me)return auth();if(page==='profile')return profile();if(page==='registrations')return '<h2>تسجيلات الصالونات</h2><details><summary>＋ تسجيل صالون تجريبي</summary>'+form('demo-salon',field('name','اسم الصالون','','text','required')+field('area','المنطقة','','text','required'))+'</details>'+users.filter(u=>u.role==='owner').map(u=>'<article><h3>'+esc(u.name)+'</h3><p>'+esc(salons.find(s=>s.owner_id===u.id)?.name)+'</p><span class="badge">'+esc(statusName[u.status])+'</span><p></p><button data-approve="'+u.id+'" data-status="'+(u.status==='active'?'blocked':'active')+'">'+(u.status==='active'?'إيقاف':'موافقة وتفعيل')+'</button></article>').join('');if(page==='locations')return '<h2>مواقع الصالونات</h2>'+salons.map(s=>'<details><summary>'+esc(s.name)+'</summary>'+form('location',field('name','اسم الصالون',s.name,'text','required')+field('area','المنطقة',s.area,'text','required')+field('lat','خط العرض',s.lat,'number','step="any"')+field('lng','خط الطول',s.lng,'number','step="any"')+'<input name="id" type="hidden" value="'+esc(s.id)+'">')+'</details>').join('');if(page==='ads'||page==='external'){const kind=page==='external'?'external':'internal',x=editing?.type==='ad'?editing.data:{};return '<h2>'+(kind==='external'?'الإعلانات الخارجية':'الإعلانات والعروض')+'</h2><details '+(x.id?'open':'')+'><summary>＋ '+(x.id?'تعديل إعلان':'إنشاء إعلان')+'</summary>'+form('ad',field('title','عنوان الإعلان',x.title,'text','required')+field('text','النص المختصر',x.text)+'<label>التفاصيل<textarea name="details">'+esc(x.details||'')+'</textarea></label><label>مكان الظهور<select name="target">'+opt({both:'التطبيقان',customer:'الزبونة',owner:'الصالون'},x.target)+'</select></label><label>الحالة<select name="active">'+opt({'1':'ظاهر','0':'مخفي'},String(x.active===false?0:1))+'</select></label>')+'</details>'+ads.filter(a=>(a.kind||'internal')===kind).map(a=>'<article><h3>'+esc(a.title)+'</h3><p>'+esc(a.text)+'</p><button class="soft small" data-edit-ad="'+esc(a.id)+'">تعديل</button></article>').join('');}if(page==='finance'){const income=ledger.filter(x=>x.kind==='income').reduce((a,x)=>a+x.amount,0),expense=ledger.filter(x=>x.kind==='expense').reduce((a,x)=>a+x.amount,0);return '<h2>المالية</h2><article><p>الإيرادات: '+money(income)+'</p><p>المصروفات: '+money(expense)+'</p><h3>الصافي: '+money(income-expense)+'</h3><small>سجل مالي يدوي؛ قبول الحجز لا يُسجل دفعة مالية.</small></article><details><summary>＋ إضافة حركة</summary>'+form('finance','<select name="kind">'+opt({income:'إيراد',expense:'مصروف'})+'</select>'+field('category','الفئة','','text','required')+field('note','الوصف','','text','required')+field('amount','المبلغ','','number','min="1" required')+field('date','التاريخ',new Date().toISOString().slice(0,10),'date','required'))+'</details>'+ledger.map(x=>'<article><h3>'+esc(x.category)+'</h3><p>'+esc(x.note)+'</p><p>'+money(x.amount)+' · '+esc(x.date)+'</p></article>').join('');}return '<h2>إدارة الحجوزات</h2>'+bookingCards();}
let lastPage='';const usageSid=sessionStorage.getItem('salonati-live-session')||crypto.randomUUID();sessionStorage.setItem('salonati-live-session',usageSid);let usageCount=0;function track(event){if(++usageCount>180)return;fetch('https://lamsa-central.arjwan307.workers.dev/usage/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:crypto.randomUUID(),sid:usageSid,app:ROLE,event,page}),keepalive:true}).catch(()=>{})}track('app_open');
function render(){if(page!==lastPage){lastPage=page;track('page_view')}const body=ROLE==='customer'?customer():ROLE==='owner'?owner():admin();$('#app').innerHTML='<div class="notice">تجربة متصلة بالخادم · بدون كلمات مرور · البيانات التجريبية مشتركة</div><header><div><small>صالوناتي · '+({customer:'الزبونة',owner:'إدارة الصالون',admin:'الإدارة'}[ROLE])+'</small><h1>'+(ROLE==='owner'&&salon?esc(salon.name):'صالوناتي')+'</h1></div><button class="soft small" data-action="refresh">↻ تحديث</button></header>'+(error?'<p class="error" role="alert">'+esc(error)+'</p>':'')+body+'<p class="muted">نقيس استخدام الأقسام والعمليات لتحسين الخدمة، دون تسجيل كلمات المرور أو نصوص الإدخال في تقارير الاستخدام.</p>'+nav()}
async function refresh(){error='';try{try{const a=await api('me');me=a.user;salon=a.salon}catch(e){if(e.message==='يلزم تسجيل الدخول'){await api('demo-session',{});const a=await api('me');me=a.user;salon=a.salon}else throw e}if(me&&me.role!==ROLE){await api('logout',{});me=null;throw Error('هذا الحساب لا يخص هذا التطبيق')}const [c,ct,ad]=await Promise.all([api('catalog'),api('content'),api('ads')]);catalog=c;content=ct.items;ads=ad.ads||[];if(me){if(ROLE==='owner')demoSalons=(await api('demo-salons')).salons;bookings=(await api('bookings')).bookings;if(ROLE==='owner'&&me.status==='active')catalog.services=(await api('services')).services;if(ROLE==='admin'){const u=await api('users');users=u.users;salons=u.salons;ledger=(await api('ledger')).entries;const a=await api('ads');ads=a.ads||[];revision=a.revision||1}}}catch(e){error=e.message}render()}
async function submit(kind,data){const d=Object.fromEntries(data);if(kind==='switch-salon'){await api('demo-session',d);page='bookings';flash('تم فتح الصالون المحدد')}if(kind==='demo-salon'){await api('demo-salon',d);flash('تم تسجيل الصالون بانتظار الموافقة')}if(kind==='login'){await api('login',d);page=ROLE==='customer'&&basket.length?'checkout':ROLE==='customer'?'home':'bookings'}if(kind==='register'){await api('register',{...d,role:ROLE});page='login';flash('تم إنشاء الحساب. يمكنكِ الدخول الآن')}if(kind==='service'){await api('services',{...d,id:editing?.type==='service'?editing.data.id:undefined,price:Number(d.price),minutes:Number(d.minutes),active:d.active==='1'});editing=null;flash('تم حفظ الخدمة على الخادم')}if(kind==='content'){await api('content',{...d,id:editing?.type==='content'?editing.data.id:undefined,price:Number(d.price),active:d.active==='1'});editing=null;flash('تم النشر')}if(kind==='salon'||kind==='location'){await put('salon',{...d,lat:d.lat===''?null:Number(d.lat),lng:d.lng===''?null:Number(d.lng)});flash('تم تحديث بيانات الصالون')}if(kind==='booking'){await api('bookings',{salonId:selectedSalon,serviceIds:basket,date:d.date,time:d.time,requestId:crypto.randomUUID()});basket=[];page='bookings';flash('تم إرسال الطلب إلى الصالون والإدارة')}if(kind==='ad'){const a={...d,id:editing?.type==='ad'?editing.data.id:crypto.randomUUID(),kind:page==='external'?'external':'internal',active:d.active==='1'};const next=ads.some(x=>x.id===a.id)?ads.map(x=>x.id===a.id?a:x):[...ads,a];await put('ads',{ads:next,revision});editing=null;flash('تم نشر الإعلان')}if(kind==='finance'){await api('ledger',{...d,amount:Number(d.amount)});flash('تم حفظ الحركة المالية')}await refresh()}
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();if(busy)return;busy=true;const b=f.querySelector('button');if(b)b.disabled=true;try{await submit(f.dataset.form,new FormData(f))}catch(x){error=x.message;const msg=document.createElement('p');msg.className='error';msg.textContent=x.message;f.querySelector('.error')?.remove();f.prepend(msg)}finally{busy=false;if(b)b.disabled=false}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;try{if(d.page){page=d.page;editing=null;selectedCategory='';render();window.scrollTo(0,0)}if(d.action==='register'||d.action==='login'){page=d.action;render()}if(d.action==='refresh')await refresh();if(d.action==='logout'){await api('logout',{});me=null;page='home';await refresh()}if(d.salon){selectedSalon=d.salon;basket=[];selectedCategory='';page='salon';render();window.scrollTo(0,0)}if(d.category){selectedCategory=d.category;render()}if(d.homeCategory){selectedCategory=selectedCategory===d.homeCategory?'':d.homeCategory;render()}if(d.kind){selectedCategory=d.kind;editing=null;render()}if(d.add){basket=basket.includes(d.add)?basket.filter(x=>x!==d.add):[...basket,d.add];render()}if(d.editService){editing={type:'service',data:catalog.services.find(x=>x.id===d.editService)};render();window.scrollTo(0,0)}if(d.editContent){editing={type:'content',data:content.find(x=>x.id===d.editContent)};selectedCategory=editing.data.kind;render();window.scrollTo(0,0)}if(d.editAd){editing={type:'ad',data:ads.find(x=>x.id===d.editAd)};render();window.scrollTo(0,0)}if(d.approve){await api('approve',{userId:d.approve,status:d.status});flash('تم تحديث حالة الصالون');await refresh()}else if(d.status&&d.id){await api('booking-status',{id:d.id,status:d.status});await refresh();flash('تم تحديث الحجز في التطبيقات')}if(d.ad){const x=ads.find(a=>a.id===d.ad);const dialog=document.createElement('dialog');dialog.style.cssText='max-width:440px;border:0;border-radius:20px;padding:25px;background:var(--card);color:inherit';dialog.innerHTML='<h2>'+esc(x.title)+'</h2><p>'+esc(x.details)+'</p><button>إغلاق</button>';dialog.querySelector('button').onclick=()=>dialog.remove();document.body.append(dialog);dialog.showModal()}}catch(x){error=x.message;render()}});
setInterval(()=>{if(!document.hidden&&!document.querySelector('form:focus-within')&&!document.querySelector('dialog')&&!busy&&['bookings','home','salon','offers'].includes(page))refresh()},20000);setInterval(()=>{const block=$('.ad');if(!block||document.hidden)return;adIndex++;const t=document.createElement('div');t.innerHTML=adBlock();block.replaceWith(t.firstElementChild)},6500);refresh();
</script></body></html>
